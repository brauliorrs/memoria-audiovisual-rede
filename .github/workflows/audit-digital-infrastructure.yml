name: Auditoria de infraestrutura digital

on:
  workflow_dispatch:
    inputs:
      corpora:
        description: "Códigos dos corpora separados por espaço; deixe vazio para o piloto"
        required: false
        default: "europeana ina bfi"
  schedule:
    - cron: "30 6 1 * *"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pytest && pip install -e .

      - name: Validar detectores e contrato da Porta 2
        run: pytest -q tests/test_digital_infrastructure_audit.py tests/test_digital_infrastructure_phase2.py

      - name: Executar auditoria piloto
        env:
          CORPORA: ${{ github.event.inputs.corpora || 'europeana ina bfi' }}
        run: |
          echo "Corpora selecionados: ${CORPORA}"
          python scripts/audit_digital_infrastructure.py --corpus ${CORPORA}

      - name: Verificar saídas
        run: |
          test -s data/output/digital_infrastructure_audit.csv
          test -s data/output/digital_infrastructure_audit.json
          test -s data/output/digital_infrastructure_audit_raw.csv
          test -s data/output/digital_infrastructure_audit_raw.json
          test -s data/output/digital_infrastructure_audit_curated.csv
          test -s data/output/digital_infrastructure_audit_curated.json
          test -s data/output/digital_infrastructure_audit_publishable.csv
          test -s data/output/digital_infrastructure_audit_publishable.json
          test -s data/output/digital_infrastructure_audit_ledger.jsonl
          python - <<'PY'
          import json
          from pathlib import Path

          legacy = json.loads(Path('data/output/digital_infrastructure_audit.json').read_text(encoding='utf-8'))
          raw = json.loads(Path('data/output/digital_infrastructure_audit_raw.json').read_text(encoding='utf-8'))
          curated = json.loads(Path('data/output/digital_infrastructure_audit_curated.json').read_text(encoding='utf-8'))
          publishable = json.loads(Path('data/output/digital_infrastructure_audit_publishable.json').read_text(encoding='utf-8'))
          if not legacy or not raw:
              raise SystemExit('A auditoria não retornou observações contratuais.')
          if any(item.get('review_status') != 'pending_review' for item in raw):
              raise SystemExit('A coleta automática promoveu indevidamente um registro para revisão concluída.')
          if curated or publishable:
              raise SystemExit('O piloto automático não pode gerar resultados curados/publicáveis sem revisão humana.')
          print(f'Unidades legadas: {len(legacy)}; detecções contratuais: {len(raw)}')
          PY

      - name: Publicar resultados da auditoria
        uses: actions/upload-artifact@v4
        with:
          name: digital-infrastructure-audit-${{ github.run_number }}
          path: |
            data/output/digital_infrastructure_audit.csv
            data/output/digital_infrastructure_audit.json
            data/output/digital_infrastructure_audit_raw.csv
            data/output/digital_infrastructure_audit_raw.json
            data/output/digital_infrastructure_audit_curated.csv
            data/output/digital_infrastructure_audit_curated.json
            data/output/digital_infrastructure_audit_publishable.csv
            data/output/digital_infrastructure_audit_publishable.json
            data/output/digital_infrastructure_audit_ledger.jsonl
          if-no-files-found: error
          retention-days: 30
