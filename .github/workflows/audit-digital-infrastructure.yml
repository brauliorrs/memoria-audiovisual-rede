name: Auditoria de infraestrutura digital

on:
  workflow_dispatch:
    inputs:
      corpora:
        description: "Códigos dos corpora separados por espaço; deixe vazio para o piloto"
        required: false
        default: "europeana ina bfi"
  schedule:
    - cron: "30 6 1 * *"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pytest

      - name: Validar detectores
        run: pytest -q tests/test_digital_infrastructure.py

      - name: Executar auditoria piloto
        env:
          CORPORA: ${{ github.event.inputs.corpora || 'europeana ina bfi' }}
        run: |
          echo "Corpora selecionados: ${CORPORA}"
          python scripts/audit_digital_infrastructure.py --corpus ${CORPORA}

      - name: Verificar saídas
        run: |
          test -s data/output/digital_infrastructure_audit.csv
          test -s data/output/digital_infrastructure_audit.json
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/output/digital_infrastructure_audit.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          if not payload:
              raise SystemExit('A auditoria não retornou registros.')
          print(f'Registros auditados: {len(payload)}')
          PY

      - name: Publicar resultados da auditoria
        uses: actions/upload-artifact@v4
        with:
          name: digital-infrastructure-audit-${{ github.run_number }}
          path: |
            data/output/digital_infrastructure_audit.csv
            data/output/digital_infrastructure_audit.json
          if-no-files-found: error
          retention-days: 30
