name: T2A AI archive two-gate validation

on:
  push:
    branches:
      - presentation/rpv-1
    paths:
      - ".github/workflows/t2a-ai-archive-two-gate-validation.yml"
      - "src/memoria_audiovisual/digital_infrastructure/ai_archive_validation.py"
      - "src/memoria_audiovisual/digital_infrastructure/ai_content_production.py"
      - "scripts/build_ai_archive_candidate_queue.py"
      - "tests/test_ai_archive_validation.py"
      - "tests/test_ai_archive_candidate_queue.py"
      - "docs/digital-infrastructure-alignment/t2a_ai_archive_two_gate_validation.md"
      - "data/digital_infrastructure/ai_experiments/ai_content_positive_challenge_scope_correction_v1.json"
  pull_request:
    paths:
      - ".github/workflows/t2a-ai-archive-two-gate-validation.yml"
      - "src/memoria_audiovisual/digital_infrastructure/ai_archive_validation.py"
      - "scripts/build_ai_archive_candidate_queue.py"
      - "tests/test_ai_archive_validation.py"
      - "tests/test_ai_archive_candidate_queue.py"
      - "docs/digital-infrastructure-alignment/t2a_ai_archive_two_gate_validation.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t2a-ai-archive-two-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARCHIVE_QUEUE: data/output/ai_archive_candidate_queue_v1.json
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest

      - name: Validate two-gate protocol
        run: |
          python -m pytest -q \
            tests/test_ai_content_production.py \
            tests/test_ai_archive_validation.py \
            tests/test_ai_archive_candidate_queue.py

      - name: Build Gate 2 candidates from materialized corpus outputs
        run: |
          python scripts/build_ai_archive_candidate_queue.py \
            --output-root data/output \
            --output "$ARCHIVE_QUEUE" \
            --max-candidates 40

      - name: Validate queue governance
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          queue = json.loads(Path(os.environ["ARCHIVE_QUEUE"]).read_text(encoding="utf-8"))
          if queue.get("does_not_modify_official_baseline") is not True:
              raise SystemExit("a validação de IA no acervo deve permanecer separada do T2")
          if queue.get("is_prevalence_sample") is not False:
              raise SystemExit("a fila de calibração não é amostra de prevalência")
          if queue.get("gate2_prediction_blinding") is not True:
              raise SystemExit("a decisão automática da Porta 2 deve permanecer oculta na revisão humana")
          forbidden = {"archive_ai_prediction", "predicted_archive_positive", "gate2_prediction"}
          for unit in queue.get("units") or []:
              if forbidden.intersection(unit):
                  raise SystemExit("fila humana contém previsão proibida da Porta 2")
              source = str(unit.get("source_output_file") or "")
              if not source:
                  raise SystemExit("todo candidato deve preservar o output materializado de origem")
          print(json.dumps({
              "status": queue.get("status"),
              "candidates_total": queue.get("candidates_total"),
              "decision_rule": queue.get("decision_rule"),
          }, ensure_ascii=False, indent=2))
          PY

      - name: Upload Gate 2 candidate queue
        uses: actions/upload-artifact@v4
        with:
          name: t2a-ai-archive-gate2-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: data/output/ai_archive_candidate_queue_v1.json
