name: Migrate Indicator Results Interface

on:
  push:
    branches:
      - presentation/rpv-1
    paths:
      - "scripts/migrate_indicator_results_interface.py"
      - ".github/workflows/migrate-indicator-results-interface.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout presentation branch
        uses: actions/checkout@v5
        with:
          ref: presentation/rpv-1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Apply interface migration
        run: python scripts/migrate_indicator_results_interface.py

      - name: Compile migrated modules
        run: python -m compileall -q src/memoria_audiovisual/scientific_infrastructure src/memoria_audiovisual/ui

      - name: Commit migrated interface
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/memoria_audiovisual/scientific_infrastructure/registry.py \
            src/memoria_audiovisual/ui/scientific_infrastructure.py
          if git diff --cached --quiet; then
            echo "Interface já estava atualizada."
            exit 0
          fi
          git commit -m "feat(ui): expor resultados científicos materializados [skip ci]"
          git push origin HEAD:presentation/rpv-1
