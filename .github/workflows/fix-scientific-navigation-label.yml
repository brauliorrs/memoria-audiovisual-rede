name: Fix scientific navigation label

on:
  push:
    branches:
      - presentation/rpv-1
    paths:
      - .github/workflows/fix-scientific-navigation-label.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: presentation/rpv-1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply semantic navigation label
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          app_path = Path('app/streamlit_app.py')
          text = app_path.read_text(encoding='utf-8')
          old = 'scientific_infrastructure_label=localize_ui("Infraestrutura científica"),'
          new = 'scientific_infrastructure_label=tr_key("navigation.scientific_infrastructure"),'
          if old in text:
              text = text.replace(old, new, 1)
              app_path.write_text(text, encoding='utf-8')
          elif new not in text:
              raise SystemExit('scientific navigation label call not found')

          translations = {
              'pt': 'Infraestrutura científica',
              'en': 'Scientific infrastructure',
              'es': 'Infraestructura científica',
          }
          for language, value in translations.items():
              path = Path(f'src/memoria_audiovisual/locales/{language}.json')
              payload = json.loads(path.read_text(encoding='utf-8'))
              payload['navigation.scientific_infrastructure'] = value
              path.write_text(
                  json.dumps(dict(sorted(payload.items())), ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8',
              )
          PY
      - name: Verify Portuguese catalogue
        run: python scripts/sync_portuguese_catalog.py --check
      - name: Run navigation tests
        run: python -m pytest -q tests/test_ui_navigation.py
      - name: Commit fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/streamlit_app.py src/memoria_audiovisual/locales/pt.json src/memoria_audiovisual/locales/en.json src/memoria_audiovisual/locales/es.json
          git commit -m "Localize scientific infrastructure navigation semantically"
          git push
