name: Editorial Cleanup 2C.4B

on:
  workflow_dispatch:
  push:
    branches:
      - presentation/rpv-1
    paths:
      - .github/workflows/editorial-cleanup-2c4b.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: presentation/rpv-1

      - name: Review and clean scientific interface copy
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/memoria_audiovisual/ui/scientific_infrastructure.py")
          text = path.read_text(encoding="utf-8")

          replacements = {
              '"Estrutura implementada; resultado não materializado"': '"Resultado não disponível"',
              '"Catálogo": "Disponível"': '"Registro": "Disponível"',
              '"Resultado": "Materializado" if result else "Aguardando execução"': '"Resultado": "Materializado" if result else "Não disponível"',
              '"Metodologia pendente no registro metodológico"': '"Metodologia não localizada no registro metodológico"',
              '"Esta camada distingue a existência do catálogo e do motor metodológico da existência de resultados efetivamente materializados."': '"Esta seção apresenta a disponibilidade dos registros científicos, das metodologias e dos resultados materializados."',
              '"Indicadores no catálogo"': '"Indicadores no registro"',
              '"A matriz de cobertura por parâmetro ainda não foi materializada no diretório operacional."': '"A matriz de cobertura por parâmetro não está disponível nesta execução."',
              '"A infraestrutura analítica está implementada, mas ainda não existe snapshot analítico materializado para apresentação de resultados empíricos."': '"O registro canônico de resultados não está disponível e não foi localizado um snapshot analítico alternativo."',
              '"Quando o pipeline for executado, esta seção carregará automaticamente resultados, manifesto, versão metodológica e análise de sensibilidade."': '"Verifique a disponibilidade dos artefatos científicos desta execução."',
              '"O arquivo de indicadores existe, mas não contém resultados reconhecíveis pelo carregador."': '"O arquivo de indicadores não contém uma coleção de resultados válida."',
              '"O registro científico existe, mas não contém resultados reconhecíveis."': '"O registro científico não contém uma coleção de resultados válida."',
              '"manifests e hashes permanecem separados"': '"manifestos e hashes permanecem separados"',
              '{"Componente": "Manifest e hash",': '{"Componente": "Manifesto e hash",',
              'with st.expander("Manifest do snapshot mais recente", expanded=False):': 'with st.expander("Manifesto do snapshot mais recente", expanded=False):',
              '"""Renderiza a seção completa na ordem de leitura científica acordada."""': '"""Renderiza a seção pública da infraestrutura científica."""',
          }

          missing = []
          for old, new in replacements.items():
              if old not in text:
                  missing.append(old)
                  continue
              text = text.replace(old, new)

          if missing:
              raise SystemExit("Trechos esperados não localizados: " + repr(missing))

          forbidden = (
              "ChatGPT",
              "Codex",
              "OpenAI",
              "generated by AI",
              "TODO",
              "FIXME",
              "HACK",
          )
          found = [token for token in forbidden if token in text]
          if found:
              raise SystemExit("Notas residuais encontradas: " + repr(found))

          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate Python and tests
        run: |
          python -m compileall -q app src scripts
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . pytest
          python -m pytest -q

      - name: Commit editorial cleanup
        run: |
          if git diff --quiet; then
            echo "No editorial changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/memoria_audiovisual/ui/scientific_infrastructure.py
          git commit -m "style: limpar mensagens e terminologia da interface científica"
          git push origin HEAD:presentation/rpv-1
