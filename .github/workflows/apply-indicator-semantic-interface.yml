name: Apply indicator semantic interface

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: presentation/rpv-1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . pytest

      - name: Apply semantic interface migration
        run: python scripts/migrate_indicator_semantic_interface.py

      - name: Validate Sprint 2A.4
        run: |
          python scripts/migrate_indicator_semantic_interface.py --check
          python -m py_compile src/memoria_audiovisual/ui/indicator_presentation.py
          python -m py_compile src/memoria_audiovisual/ui/scientific_infrastructure.py
          python -m pytest -q \
            tests/test_indicator_presentation.py \
            tests/test_indicator_registry.py \
            tests/test_indicator_consistency.py \
            tests/test_scientific_infrastructure_registry.py

      - name: Guard canonical semantics
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/memoria_audiovisual/ui/scientific_infrastructure.py")
          text = path.read_text(encoding="utf-8")
          required = (
              "build_indicator_presentations",
              "registry_summary",
              "scientific_rationale",
              "evidence_requirements",
              "methodology_reference",
              "expected_range",
          )
          missing = [token for token in required if token not in text]
          if missing:
              raise SystemExit("Campos semânticos ausentes: " + ", ".join(missing))
          if 'metric("Versão do catálogo", "1.0.0")' in text:
              raise SystemExit("Versão fixa do catálogo ainda presente")
          print("Interface consome a semântica canônica do registro.")
          PY

      - name: Remove disposable executor
        run: rm .github/workflows/apply-indicator-semantic-interface.yml

      - name: Commit definitive Sprint 2A.4 state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/memoria_audiovisual/ui/scientific_infrastructure.py \
            .github/workflows/apply-indicator-semantic-interface.yml
          git diff --cached --check
          git commit -m "feat: apresentar semântica canônica dos indicadores"
          git push origin HEAD:presentation/rpv-1
