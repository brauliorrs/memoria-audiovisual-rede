name: Refatoração temporária de infraestrutura digital

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Refatorar branch da Fase 2
        shell: bash
        env:
          REPO: ${{ github.repository }}
          TARGET_BRANCH: feature/fase2-adaptador-auditoria-infraestrutura
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${{ github.token }}@github.com/${REPO}.git" repo
          cd repo
          git checkout "${TARGET_BRANCH}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python - <<'PY'
          from pathlib import Path
          import subprocess

          replacements = [
              ('statetech-history', 'digital-infrastructure-history'),
              ('statetech-periodic-review', 'digital-infrastructure-periodic-review'),
              ('statetech-alignment', 'digital-infrastructure-alignment'),
              ('statetech-', 'digital-infrastructure-'),
              ('STATETECH', 'DIGITAL_INFRASTRUCTURE'),
              ('Statetech', 'Digital Infrastructure'),
              ('statetech', 'digital_infrastructure'),
              ('Estado–tecnologia', 'infraestrutura digital'),
              ('Estado-tecnologia', 'infraestrutura digital'),
              ('Estado–Tecnologia', 'Infraestrutura digital'),
              ('Estado-Tecnologia', 'Infraestrutura digital'),
          ]
          tracked = [Path(p) for p in subprocess.check_output(['git','ls-files','-z']).decode().split('\0') if p]

          def new_path(path: Path) -> Path:
              text = path.as_posix()
              if text == '.github/workflows/statetech-periodic-review.yml':
                  return Path('.github/workflows/digital-infrastructure-periodic-review.yml')
              if text.startswith('docs/statetech-alignment/'):
                  return Path(text.replace('docs/statetech-alignment/', 'docs/digital-infrastructure-alignment/', 1))
              return Path(text.replace('statetech', 'digital_infrastructure'))

          for old in tracked:
              if old.as_posix() == '.github/workflows/refactor-digital-infrastructure.yml':
                  subprocess.run(['git','rm','-f',old.as_posix()], check=True)
                  continue
              if not old.exists() or not old.is_file():
                  continue
              try:
                  text = old.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              for source, target in replacements:
                  text = text.replace(source, target)
              new = new_path(old)
              new.parent.mkdir(parents=True, exist_ok=True)
              new.write_text(text, encoding='utf-8')
              if new != old:
                  subprocess.run(['git','rm','-f','--ignore-unmatch',old.as_posix()], check=True)
                  subprocess.run(['git','add',new.as_posix()], check=True)
              else:
                  subprocess.run(['git','add',old.as_posix()], check=True)

          forbidden = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if 'statetech' in path.as_posix().casefold():
                  forbidden.append(path.as_posix())
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if 'statetech' in text.casefold():
                  forbidden.append(path.as_posix())
          if forbidden:
              raise SystemExit('Termo proibido ainda presente: ' + ', '.join(sorted(set(forbidden))))
          PY

          if ! git diff --cached --quiet; then
            git commit -m "refactor: adotar nomenclatura infraestrutura digital"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi

      - name: Remover workflow temporário da main
        shell: bash
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd repo
          git checkout main
          git pull --ff-only origin main
          git rm -f .github/workflows/temporary-digital-infrastructure-refactor.yml
          git commit -m "chore: remover workflow temporário de refatoração"
          git push origin main
