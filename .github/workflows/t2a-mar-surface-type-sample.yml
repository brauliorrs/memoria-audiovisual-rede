name: T2A MAR surface typing real sample

on:
  pull_request:
    branches:
      - feature/fase2-adaptador-auditoria-infraestrutura
    paths:
      - "scripts/run_mar_surface_type_sample.py"
      - "scripts/build_surface_type_review_queue.py"
      - "src/memoria_audiovisual/digital_infrastructure/ai_surface_discovery.py"
      - "src/memoria_audiovisual/digital_infrastructure/surface_typing.py"
      - ".github/workflows/t2a-mar-surface-type-sample.yml"
  workflow_dispatch:
    inputs:
      run_id:
        description: "Identificador auditável da execução M3"
        required: false
        default: "m3-surface-sample-v1"
        type: string

permissions:
  contents: read

concurrency:
  group: t2a-mar-surface-type-sample-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUN_ID: ${{ inputs.run_id || 'm3-surface-sample-v1' }}
      PREDICTIONS: data/output/m3_surface_type_predictions_v1.json
      REVIEW_QUEUE: data/output/m3_surface_type_review_queue_v1.json
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Explore real public surfaces
        run: |
          python scripts/run_mar_surface_type_sample.py \
            --run-id "$RUN_ID" \
            --entities ina ecpad archipop bfi europeana \
            --max-depth 1 \
            --max-pages 6

      - name: Build blinded M3 review queue
        run: |
          python scripts/build_surface_type_review_queue.py \
            --input-root "data/output/_ai_surface_discovery/$RUN_ID" \
            --predictions-output "$PREDICTIONS" \
            --review-output "$REVIEW_QUEUE" \
            --max-units 30

      - name: Validate experimental separation
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          predictions = json.loads(Path(os.environ["PREDICTIONS"]).read_text(encoding="utf-8"))
          review = json.loads(Path(os.environ["REVIEW_QUEUE"]).read_text(encoding="utf-8"))
          if predictions.get("does_not_modify_official_baseline") is not True:
              raise SystemExit("M3 predictions must remain outside T2")
          if review.get("does_not_modify_official_baseline") is not True:
              raise SystemExit("M3 review queue must remain outside T2")
          if review.get("model_prediction_blinded") is not True:
              raise SystemExit("M3 human review must remain blinded")
          if review.get("units_total", 0) < 1:
              raise SystemExit("real M3 sample produced no reviewable surface observations")
          print(json.dumps({
              "run_id": os.environ["RUN_ID"],
              "units_total": review.get("units_total"),
              "review_status": review.get("status"),
          }, ensure_ascii=False, indent=2))
          PY

      - name: Upload M3 validation products
        uses: actions/upload-artifact@v4
        with:
          name: t2a-mar-surface-type-sample-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            data/output/_ai_surface_discovery/${{ env.RUN_ID }}/
            data/output/m3_surface_type_predictions_v1.json
            data/output/m3_surface_type_review_queue_v1.json
