name: T2A MAR surface typing calibration smoke 2.1

on:
  pull_request:
    branches:
      - feature/fase2-adaptador-auditoria-infraestrutura
    paths:
      - "scripts/run_mar_surface_type_sample.py"
      - "scripts/build_surface_type_review_queue.py"
      - "src/memoria_audiovisual/digital_infrastructure/ai_surface_discovery.py"
      - "src/memoria_audiovisual/digital_infrastructure/surface_typing.py"
      - "tests/test_surface_typing.py"
      - ".github/workflows/t2a-mar-surface-type-sample.yml"
  workflow_dispatch:
    inputs:
      run_id:
        description: "Identificador auditável da execução de calibração M3 2.1"
        required: false
        default: "m3-surface-calibration-smoke-v2-1"
        type: string

permissions:
  contents: read

concurrency:
  group: t2a-mar-surface-type-sample-2-1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUN_ID: ${{ inputs.run_id || 'm3-surface-calibration-smoke-v2-1' }}
      PREDICTIONS: data/output/m3_surface_type_predictions_v2_1.json
      REVIEW_QUEUE: data/output/m3_surface_type_review_queue_v2_1.json
      FREEZE_MANIFEST: data/output/m3_surface_type_prediction_freeze_v2_1.json
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest

      - name: Run M3 regression tests
        run: |
          pytest -q tests/test_surface_typing.py

      - name: Explore real public surfaces for calibration smoke
        run: |
          python scripts/run_mar_surface_type_sample.py \
            --run-id "$RUN_ID" \
            --entities ina ecpad archipop bfi europeana \
            --max-depth 1 \
            --max-pages 6

      - name: Build blinded M3 2.1 review queue
        run: |
          python scripts/build_surface_type_review_queue.py \
            --input-root "data/output/_ai_surface_discovery/$RUN_ID" \
            --predictions-output "$PREDICTIONS" \
            --review-output "$REVIEW_QUEUE" \
            --max-units 30 \
            --artifact-id "m3-surface-type-predictions-v2-1" \
            --queue-id "m3-surface-type-review-v2-1" \
            --stage "t2a_mar_surface_typing_calibration" \
            --sample-role "calibration_smoke_only"

      - name: Freeze automatic predictions
        env:
          GIT_SHA: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          predictions_path = Path(os.environ["PREDICTIONS"])
          review_path = Path(os.environ["REVIEW_QUEUE"])
          freeze_path = Path(os.environ["FREEZE_MANIFEST"])
          predictions_bytes = predictions_path.read_bytes()
          predictions = json.loads(predictions_bytes)
          review = json.loads(review_path.read_text(encoding="utf-8"))

          if predictions.get("protocol_version") != "2.1.0":
              raise SystemExit("M3 calibration smoke must use surface typing protocol 2.1.0")
          if review.get("protocol_version") != "2.1.0":
              raise SystemExit("M3 review queue must use surface typing protocol 2.1.0")

          freeze = {
              "schema_version": "1.0.0",
              "artifact_id": "m3-surface-type-prediction-freeze-v2-1",
              "protocol_version": predictions["protocol_version"],
              "source_run_id": os.environ["RUN_ID"],
              "source_workflow_run_id": int(os.environ["WORKFLOW_RUN_ID"]),
              "source_git_sha": os.environ["GIT_SHA"],
              "sample_role": "calibration_smoke_only",
              "is_independent_validation_sample": False,
              "does_not_modify_official_baseline": True,
              "prediction_path": str(predictions_path),
              "prediction_sha256": hashlib.sha256(predictions_bytes).hexdigest(),
              "prediction_units_total": predictions.get("units_total", 0),
              "review_queue_path": str(review_path),
              "model_prediction_blinded_in_review_queue": review.get("model_prediction_blinded"),
          }
          freeze_path.write_text(
              json.dumps(freeze, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(freeze, ensure_ascii=False, indent=2))
          PY

      - name: Validate calibration-only separation
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          predictions_path = Path(os.environ["PREDICTIONS"])
          predictions = json.loads(predictions_path.read_text(encoding="utf-8"))
          review = json.loads(Path(os.environ["REVIEW_QUEUE"]).read_text(encoding="utf-8"))
          freeze = json.loads(Path(os.environ["FREEZE_MANIFEST"]).read_text(encoding="utf-8"))

          if predictions.get("does_not_modify_official_baseline") is not True:
              raise SystemExit("M3 predictions must remain outside T2")
          if review.get("does_not_modify_official_baseline") is not True:
              raise SystemExit("M3 review queue must remain outside T2")
          if review.get("model_prediction_blinded") is not True:
              raise SystemExit("M3 review queue must remain prediction-blinded")
          if review.get("units_total", 0) < 1:
              raise SystemExit("real M3 calibration smoke produced no reviewable surfaces")
          if freeze.get("is_independent_validation_sample") is not False:
              raise SystemExit("calibration smoke must not be labelled independent validation")
          actual_sha256 = hashlib.sha256(predictions_path.read_bytes()).hexdigest()
          if actual_sha256 != freeze.get("prediction_sha256"):
              raise SystemExit("M3 prediction SHA-256 mismatch")

          print(json.dumps({
              "run_id": os.environ["RUN_ID"],
              "protocol_version": predictions.get("protocol_version"),
              "units_total": review.get("units_total"),
              "review_status": review.get("status"),
              "prediction_sha256": actual_sha256,
              "sample_role": freeze.get("sample_role"),
          }, ensure_ascii=False, indent=2))
          PY

      - name: Upload M3 2.1 calibration products
        uses: actions/upload-artifact@v4
        with:
          name: t2a-mar-surface-type-calibration-v2-1-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            data/output/_ai_surface_discovery/${{ env.RUN_ID }}/
            data/output/m3_surface_type_predictions_v2_1.json
            data/output/m3_surface_type_review_queue_v2_1.json
            data/output/m3_surface_type_prediction_freeze_v2_1.json
