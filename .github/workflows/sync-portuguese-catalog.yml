name: Sync Portuguese Catalogue

on:
  push:
    branches:
      - presentation/rpv-1
    paths:
      - "scripts/sync_portuguese_catalog.py"
      - ".github/workflows/sync-portuguese-catalog.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout presentation branch
        uses: actions/checkout@v4
        with:
          ref: presentation/rpv-1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Synchronize Portuguese catalogue
        run: python scripts/sync_portuguese_catalog.py
      - name: Validate catalogue coverage
        run: python scripts/sync_portuguese_catalog.py --check
      - name: Commit synchronized catalogue
        run: |
          if git diff --quiet -- src/memoria_audiovisual/locales/pt.json; then
            echo "Catalogue already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/memoria_audiovisual/locales/pt.json
          git commit -m "refactor(i18n): complete canonical Portuguese catalogue [skip ci]"
          git push origin HEAD:presentation/rpv-1
