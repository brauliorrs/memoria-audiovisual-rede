name: Refresh Gosfilmofond baseline

on:
  push:
    branches:
      - corpus/gosfilmofond-v1

permissions:
  actions: read
  contents: write

concurrency:
  group: gosfilmofond-artifact-import-v1
  cancel-in-progress: false

jobs:
  materialize:
    if: "!contains(github.event.head_commit.message, '[gosfilmofond-refresh]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: corpus/gosfilmofond-v1
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"
      - name: Import validated staged artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import io
          import os
          import zipfile
          from pathlib import Path

          import requests

          artifact_id = 11185896280
          expected_files = 24
          url = (
              "https://api.github.com/repos/"
              "brauliorrs/memoria-audiovisual-rede/actions/artifacts/"
              f"{artifact_id}/zip"
          )
          response = requests.get(
              url,
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              timeout=120,
          )
          response.raise_for_status()
          target = Path("data/output")
          target.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(response.content)) as archive:
              members = [
                  name for name in archive.namelist()
                  if Path(name).name.startswith("gosfilmofond_")
              ]
              if len(members) != expected_files:
                  raise SystemExit(
                      f"artifact_file_count_mismatch:{len(members)}"
                  )
              for name in members:
                  destination = target / Path(name).name
                  destination.write_bytes(archive.read(name))
          print(
              "Imported validated artifact "
              f"{artifact_id} with {len(members)} Gosfilmofond outputs."
          )
          PY
      - name: Revalidate imported baseline
        run: python scripts/check_gosfilmofond_outputs.py
      - name: Commit validated baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/output/gosfilmofond_*
          git diff --cached --quiet && {
            echo "No baseline changes to commit."
            exit 0
          }
          git commit -m "data(gosfilmofond): persist validated staged baseline [gosfilmofond-refresh]"
          git push origin HEAD:corpus/gosfilmofond-v1
