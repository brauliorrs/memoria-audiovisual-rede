name: Refresh Gosfilmofond baseline

on:
  push:
    branches:
      - corpus/gosfilmofond-v1

permissions:
  contents: write

concurrency:
  group: gosfilmofond-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: "!contains(github.event.head_commit.message, '[gosfilmofond-refresh]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: corpus/gosfilmofond-v1
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"
      - name: Refresh and validate baseline
        run: |
          python scripts/run_gosfilmofond_pipeline.py
          python scripts/check_gosfilmofond_outputs.py
      - name: Commit refreshed baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/output/gosfilmofond_*
          git diff --cached --quiet && {
            echo "No baseline changes to commit."
            exit 0
          }
          git commit -m "data(gosfilmofond): refresh canonical public-catalog baseline [gosfilmofond-refresh]"
          git push origin HEAD:corpus/gosfilmofond-v1
