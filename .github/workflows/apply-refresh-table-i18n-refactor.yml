name: Apply definitive refresh table i18n refactor

on:
  push:
    branches:
      - presentation/rpv-1
    paths:
      - .github/workflows/apply-refresh-table-i18n-refactor.yml
      - scripts/apply_refresh_table_i18n_refactor.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: presentation/rpv-1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Apply refactor
        run: python scripts/apply_refresh_table_i18n_refactor.py

      - name: Validate targeted tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . pytest
          python -m pytest -q tests/test_refresh_table_locale_compatibility.py
          python -m compileall -q app src

      - name: Commit definitive solution
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/streamlit_app.py src/memoria_audiovisual/ui/refresh_table.py src/memoria_audiovisual/locale_catalog.py tests/test_refresh_table_locale_compatibility.py
          git commit -m "fix: refatorar tabela de atualização com nomes internos" || exit 0
          git push origin HEAD:presentation/rpv-1
