name: Migrate Home i18n

on:
  push:
    branches:
      - presentation/rpv-1
    paths:
      - scripts/migrate_home_to_semantic_i18n.py
      - .github/workflows/migrate-home-i18n.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: presentation/rpv-1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply deterministic migration
        run: python scripts/migrate_home_to_semantic_i18n.py

      - name: Validate Python syntax and Portuguese catalogue
        run: |
          python -m py_compile app/streamlit_app.py src/memoria_audiovisual/locale_catalog.py
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('src/memoria_audiovisual/locales/pt.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          required = {
              'home.title', 'home.caption', 'home.search.label',
              'home.search.placeholder', 'home.search.button',
              'home.search.close', 'navigation.overview',
              'navigation.category', 'navigation.unit',
              'navigation.documented_case',
          }
          missing = required - set(payload)
          if missing:
              raise SystemExit(f'Missing keys: {sorted(missing)}')
          PY

      - name: Commit migrated Home
        run: |
          if git diff --quiet; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/streamlit_app.py src/memoria_audiovisual/locales/pt.json
          git commit -m 'refactor(i18n): migrate Home to Portuguese semantic catalogue [skip ci]'
          git push origin HEAD:presentation/rpv-1
