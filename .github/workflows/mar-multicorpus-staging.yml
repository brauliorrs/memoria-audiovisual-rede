name: MAR Multicorpus Staging
on:
  pull_request:
    paths:
      - 'scripts/import_mar_multicorpus.py'
      - 'tests/test_mar_multicorpus_staging.py'
      - '.github/workflows/mar-multicorpus-staging.yml'
      - 'data/output/eye_catalogo_videos_analitico.csv'
      - 'data/output/czech_tv_catalogo_videos_analitico.csv'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage-eye-then-czech:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate normalization and denied-publication contracts
        run: python -m unittest discover -s tests -p 'test_mar_multicorpus_staging.py' -v
      - name: First technical pilot — Eye Filmmuseum
        run: python scripts/import_mar_multicorpus.py --corpus eye --limit 2
      - name: Second technical pilot — Czech Television
        run: python scripts/import_mar_multicorpus.py --corpus czech --limit 2
      - name: Protect existing authorized KAVI projection
        run: python scripts/check_mar_site_index.py
