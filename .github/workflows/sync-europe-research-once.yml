name: Sync Europe Research Once

on:
  push:
    paths:
      - .github/workflows/sync-europe-research-once.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: presentation/rpv-1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Regenerate and validate European products
        run: |
          python scripts/sync_europe_research_outputs.py
          python scripts/sync_europe_research_outputs.py --check

      - name: Commit generated products and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/output/observatorio_pesquisa_europa.csv
          git add data/output/observatorio_fila_pesquisa_europa.csv
          git add data/output/observatorio_resumo_pesquisa_europa.csv
          git rm .github/workflows/sync-europe-research-once.yml
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "data: regenerate canonical European research products"
            git push origin HEAD:presentation/rpv-1
          fi
