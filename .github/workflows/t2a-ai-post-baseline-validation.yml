name: T2A AI post-baseline validation

on:
  push:
    branches:
      - presentation/rpv-1
    paths:
      - ".github/workflows/t2a-ai-post-baseline-validation.yml"
      - "src/memoria_audiovisual/digital_infrastructure/ai_post_baseline_validation.py"
      - "src/memoria_audiovisual/digital_infrastructure/ai_surface_discovery.py"
      - "src/memoria_audiovisual/digital_infrastructure/ai_content_production.py"
      - "src/memoria_audiovisual/digital_infrastructure/ai_content_validation.py"
      - "src/memoria_audiovisual/digital_infrastructure/ai_baseline_handlers.py"
      - "src/memoria_audiovisual/digital_infrastructure/ai_contracts.py"
      - "src/memoria_audiovisual/digital_infrastructure/ai_flags.py"
      - "src/memoria_audiovisual/digital_infrastructure/ai_runtime.py"
      - "src/memoria_audiovisual/digital_infrastructure/ai_storage.py"
      - "scripts/evaluate_ai_post_baseline.py"
      - "scripts/build_ai_content_validation_sample.py"
      - "tests/test_ai_post_baseline_validation.py"
      - "tests/test_ai_surface_discovery.py"
      - "tests/test_ai_content_production.py"
      - "tests/test_ai_content_validation.py"
      - "tests/test_ai_baseline_handlers.py"
      - "tests/test_ai_experiment_contracts.py"
      - "tests/test_ai_feature_flags.py"
      - "tests/test_ai_storage_runtime.py"
      - "data/digital_infrastructure/ai_experiments/t2a_human_review_queue_v1.json"
      - "data/digital_infrastructure/ai_experiments/t2a_human_review_amendments_v1.jsonl"
      - "data/digital_infrastructure/ai_experiments/ai_content_validation_sample_v1.json"
      - "data/digital_infrastructure/ai_experiments/ai_content_validation_report_v1.json"
  pull_request:
    paths:
      - ".github/workflows/t2a-ai-post-baseline-validation.yml"
      - "src/memoria_audiovisual/digital_infrastructure/ai_post_baseline_validation.py"
      - "src/memoria_audiovisual/digital_infrastructure/ai_surface_discovery.py"
      - "src/memoria_audiovisual/digital_infrastructure/ai_content_production.py"
      - "src/memoria_audiovisual/digital_infrastructure/ai_content_validation.py"
      - "src/memoria_audiovisual/digital_infrastructure/ai_baseline_handlers.py"
      - "src/memoria_audiovisual/digital_infrastructure/ai_contracts.py"
      - "src/memoria_audiovisual/digital_infrastructure/ai_flags.py"
      - "src/memoria_audiovisual/digital_infrastructure/ai_runtime.py"
      - "src/memoria_audiovisual/digital_infrastructure/ai_storage.py"
      - "scripts/evaluate_ai_post_baseline.py"
      - "scripts/build_ai_content_validation_sample.py"
      - "tests/test_ai_post_baseline_validation.py"
      - "tests/test_ai_surface_discovery.py"
      - "tests/test_ai_content_production.py"
      - "tests/test_ai_content_validation.py"
      - "tests/test_ai_baseline_handlers.py"
      - "tests/test_ai_experiment_contracts.py"
      - "tests/test_ai_feature_flags.py"
      - "tests/test_ai_storage_runtime.py"
      - "data/digital_infrastructure/ai_experiments/t2a_human_review_queue_v1.json"
      - "data/digital_infrastructure/ai_experiments/t2a_human_review_amendments_v1.jsonl"
      - "data/digital_infrastructure/ai_experiments/ai_content_validation_sample_v1.json"
      - "data/digital_infrastructure/ai_experiments/ai_content_validation_report_v1.json"
  workflow_dispatch:
    inputs:
      require_complete:
        description: "Exigir que todas as unidades estejam revisadas"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: t2a-ai-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REVIEW_QUEUE: data/digital_infrastructure/ai_experiments/t2a_human_review_queue_v1.json
      REVIEW_AMENDMENTS: data/digital_infrastructure/ai_experiments/t2a_human_review_amendments_v1.jsonl
      REPORT: data/digital_infrastructure/ai_experiments/t2a_validation_report_v1.json
      CONTENT_SAMPLE: data/digital_infrastructure/ai_experiments/ai_content_validation_sample_v1.json
      CONTENT_REPORT: data/digital_infrastructure/ai_experiments/ai_content_validation_report_v1.json
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest

      - name: Validate T2A contracts and new protocols
        run: |
          python -m compileall -q src scripts
          python -m pytest -q \
            tests/test_ai_post_baseline_validation.py \
            tests/test_ai_surface_discovery.py \
            tests/test_ai_content_production.py \
            tests/test_ai_content_validation.py \
            tests/test_ai_baseline_handlers.py \
            tests/test_ai_experiment_contracts.py \
            tests/test_ai_feature_flags.py \
            tests/test_ai_storage_runtime.py

      - name: Validate content-AI reference benchmark
        run: |
          python scripts/build_ai_content_validation_sample.py \
            --sample "$CONTENT_SAMPLE" \
            --report "$CONTENT_REPORT" \
            --check

      - name: Calculate current review metrics
        shell: bash
        run: |
          args=(--queue "$REVIEW_QUEUE" --amendments "$REVIEW_AMENDMENTS" --output "$REPORT")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.require_complete }}" = "true" ]; then
            args+=(--require-complete)
          fi
          python scripts/evaluate_ai_post_baseline.py "${args[@]}"

      - name: Validate separation from T2
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(os.environ["REPORT"]).read_text(encoding="utf-8"))
          content_report = json.loads(Path(os.environ["CONTENT_REPORT"]).read_text(encoding="utf-8"))
          if report.get("official_baseline_dependency") is not False:
              raise SystemExit("T2A não pode depender do baseline como entrada mutável")
          if report.get("does_not_modify_official_baseline") is not True:
              raise SystemExit("T2A deve declarar que não modifica o baseline oficial")
          if report.get("review_units_total") != 18:
              raise SystemExit("a fila inicial deve conter 18 unidades")
          if report.get("amendments_applied", 0) < 1:
              raise SystemExit("a emenda metodológica do INA deve ser aplicada")
          if content_report.get("controls") != 6:
              raise SystemExit("o benchmark item a item v1 deve conter seis controles")
          binary = content_report.get("binary") or {}
          if binary.get("false_positive") != 0 or binary.get("false_negative") != 0:
              raise SystemExit("o benchmark item a item de referência contém erro binário")
          if content_report.get("exact_class_accuracy") != 1.0:
              raise SystemExit("as classes do benchmark item a item não estão calibradas")
          print(json.dumps({
              "status": report.get("status"),
              "review_units_total": report.get("review_units_total"),
              "reviewed_units": report.get("reviewed_units"),
              "pending_units": report.get("pending_units"),
              "amendments_applied": report.get("amendments_applied"),
              "content_ai_controls": content_report.get("controls"),
              "content_ai_exact_class_accuracy": content_report.get("exact_class_accuracy"),
          }, ensure_ascii=False, indent=2))
          PY

      - name: Upload T2A validation products
        uses: actions/upload-artifact@v4
        with:
          name: t2a-ai-validation-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            data/digital_infrastructure/ai_experiments/t2a_human_review_queue_v1.json
            data/digital_infrastructure/ai_experiments/t2a_human_review_amendments_v1.jsonl
            data/digital_infrastructure/ai_experiments/t2a_validation_report_v1.json
            data/digital_infrastructure/ai_experiments/ai_content_validation_sample_v1.json
            data/digital_infrastructure/ai_experiments/ai_content_validation_report_v1.json
