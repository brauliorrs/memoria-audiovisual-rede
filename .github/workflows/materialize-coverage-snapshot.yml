name: Materialize Coverage Snapshot v1

on:
  workflow_dispatch:
  push:
    branches:
      - presentation/rpv-1
    paths:
      - ".github/workflows/materialize-coverage-snapshot.yml"

permissions:
  contents: write

concurrency:
  group: materialize-coverage-snapshot-v1
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SNAPSHOT_ID: scientific-coverage-v1-${{ github.run_id }}
      COVERAGE_DIR: data/digital_infrastructure/coverage
      RESULT_OUTPUT: data/output/scientific_coverage_v1_execution.json
      COVERAGE_SNAPSHOT: data/reference_corpus/snapshots/coverage_snapshot_v1.0.json
    steps:
      - name: Checkout presentation branch
        uses: actions/checkout@v5
        with:
          ref: presentation/rpv-1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . pytest

      - name: Record execution start
        run: |
          echo "STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Audit all 58 reference corpora
        run: |
          python scripts/audit_digital_infrastructure.py \
            --mode preview \
            --snapshot-id "$SNAPSHOT_ID" \
            --include-inactive \
            --timeout 30 \
            --write-coverage \
            --coverage-dir "$COVERAGE_DIR" \
            --result-output "$RESULT_OUTPUT"

      - name: Resolve coverage matrix
        id: coverage
        shell: bash
        run: |
          COVERAGE_PATH=$(python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("data/output/scientific_coverage_v1_execution.json").read_text(encoding="utf-8"))
          if payload.get("source_count") != 58:
              raise SystemExit(f"esperadas 58 fontes; obtidas {payload.get('source_count')}")
          manifest = payload.get("coverage_manifest") or {}
          path = manifest.get("coverage_path")
          if not path:
              raise SystemExit("coverage_path ausente")
          if manifest.get("corpus_count") != 58:
              raise SystemExit(f"esperados 58 corpora; obtidos {manifest.get('corpus_count')}")
          if manifest.get("parameter_count") != 406:
              raise SystemExit(f"esperados 406 estados; obtidos {manifest.get('parameter_count')}")
          print(path)
          PY
          )
          test -f "$COVERAGE_PATH"
          echo "path=$COVERAGE_PATH" >> "$GITHUB_OUTPUT"

      - name: Materialize Coverage Snapshot v1.0
        run: |
          FINISHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          FINISH_EPOCH=$(date +%s)
          DURATION_SECONDS=$((FINISH_EPOCH - START_EPOCH))
          python scripts/materialize_coverage_snapshot.py \
            --coverage "${{ steps.coverage.outputs.path }}" \
            --source-snapshot-id "$SNAPSHOT_ID" \
            --started-at "$STARTED_AT" \
            --finished-at "$FINISHED_AT" \
            --duration-seconds "$DURATION_SECONDS" \
            --pipeline-commit "$GITHUB_SHA" \
            --output "$COVERAGE_SNAPSHOT"

      - name: Validate materialized snapshot
        run: |
          python scripts/audit_coverage_snapshot.py
          python -m pytest -q tests/test_coverage_snapshot.py

      - name: Commit scientific coverage products
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/digital_infrastructure/coverage \
            data/output/scientific_coverage_v1_execution.json \
            data/reference_corpus/snapshots/coverage_snapshot_v1.0.json
          if git diff --cached --quiet; then
            echo "Nenhum produto novo para registrar."
            exit 0
          fi
          git commit -m "data(science): materializar coverage snapshot v1 [skip ci]"
          git push origin HEAD:presentation/rpv-1
