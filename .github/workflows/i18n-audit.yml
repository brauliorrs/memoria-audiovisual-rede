name: I18N Audit

on:
  push:
    branches:
      - presentation/rpv-1
    paths:
      - "app/**/*.py"
      - "src/memoria_audiovisual/i18n.py"
      - "src/memoria_audiovisual/research_profile.py"
      - "scripts/audit_streamlit_i18n.py"
      - ".github/workflows/i18n-audit.yml"
  pull_request:
    branches:
      - feature/fase2-adaptador-auditoria-infraestrutura
    paths:
      - "app/**/*.py"
      - "src/memoria_audiovisual/i18n.py"
      - "src/memoria_audiovisual/research_profile.py"
      - "scripts/audit_streamlit_i18n.py"
      - ".github/workflows/i18n-audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Streamlit language audit
        id: audit
        continue-on-error: true
        run: |
          python scripts/audit_streamlit_i18n.py > i18n-audit.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Build readable audit report
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          findings = json.loads(Path("i18n-audit.json").read_text(encoding="utf-8"))
          by_file = Counter(item["path"] for item in findings)
          by_call = Counter(item["call"] for item in findings)

          lines = [
              "# Streamlit language audit",
              "",
              f"Unwrapped public text occurrences: **{len(findings)}**",
              "",
              "## By file",
              "",
          ]
          lines.extend(f"- `{path}`: {count}" for path, count in sorted(by_file.items()))
          lines.extend(["", "## By Streamlit call", ""])
          lines.extend(f"- `{call}`: {count}" for call, count in sorted(by_call.items()))
          lines.extend(["", "## Findings", ""])
          for item in findings:
              lines.append(
                  f"- `{item['path']}:{item['line']}` — `{item['call']}` — {item['text']}"
              )
          Path("i18n-audit.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: i18n-audit-report
          path: |
            i18n-audit.json
            i18n-audit.md

      - name: Enforce audit result
        if: steps.audit.outputs.exit_code != '0'
        run: |
          echo "Unwrapped Streamlit interface text was found. See the i18n-audit-report artifact."
          exit 1
