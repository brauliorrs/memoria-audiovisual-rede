name: I18N Audit

on:
  push:
    branches:
      - presentation/rpv-1
    paths:
      - "app/**/*.py"
      - "src/memoria_audiovisual/i18n.py"
      - "src/memoria_audiovisual/research_profile.py"
      - "scripts/audit_streamlit_i18n.py"
      - ".github/workflows/i18n-audit.yml"
      - "docs/project/BACKLOG.md"
  pull_request:
    branches:
      - feature/fase2-adaptador-auditoria-infraestrutura
    paths:
      - "app/**/*.py"
      - "src/memoria_audiovisual/i18n.py"
      - "src/memoria_audiovisual/research_profile.py"
      - "scripts/audit_streamlit_i18n.py"
      - ".github/workflows/i18n-audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Streamlit language audit
        id: audit
        shell: bash
        run: |
          set +e
          python scripts/audit_streamlit_i18n.py > i18n-audit.json
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          test -s i18n-audit.json || echo '[]' > i18n-audit.json

      - name: Build readable audit report
        run: |
          python - <<'PY'
          import json
          from collections import Counter, defaultdict
          from pathlib import Path

          findings = json.loads(Path("i18n-audit.json").read_text(encoding="utf-8"))
          by_page = Counter(item["page"] for item in findings)
          by_kind = Counter(item["kind"] for item in findings)
          by_severity = Counter(item["severity"] for item in findings)
          grouped = defaultdict(list)
          for item in findings:
              grouped[item["page"]].append(item)

          lines = [
              "# Language MVP+ audit",
              "",
              f"Total findings: **{len(findings)}**",
              "",
              "## By page or module",
              "",
          ]
          lines.extend(f"- **{page}**: {count}" for page, count in sorted(by_page.items()))
          lines.extend(["", "## By finding type", ""])
          lines.extend(f"- `{kind}`: {count}" for kind, count in sorted(by_kind.items()))
          lines.extend(["", "## By severity", ""])
          lines.extend(f"- `{severity}`: {count}" for severity, count in sorted(by_severity.items()))

          for page in sorted(grouped):
              lines.extend(["", f"## {page}", ""])
              for item in grouped[page]:
                  languages = ", ".join(item.get("languages") or [])
                  language_note = f" — languages: `{languages}`" if languages else ""
                  lines.append(
                      f"- **{item['severity']}** — `{item['kind']}` — "
                      f"`{item['path']}:{item['line']}` — `{item['call']}`{language_note} — {item['text']}"
                  )

          Path("i18n-audit.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: i18n-audit-report
          path: |
            i18n-audit.json
            i18n-audit.md

      - name: Enforce audit result
        if: steps.audit.outputs.exit_code != '0'
        run: |
          echo "Language MVP+ findings remain. See the i18n-audit-report artifact."
          exit 1
