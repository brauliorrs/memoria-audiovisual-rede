name: Controlled observatory cycle

on:
  push:
    branches:
      - presentation/rpv-1
    paths:
      - ".github/workflows/controlled-observatory-cycle.yml"
  workflow_dispatch:
    inputs:
      corpora:
        description: "Códigos separados por vírgula"
        required: false
        default: "europeana,ina,bfi"
        type: string
      enable_ai:
        description: "Coletar sinais experimentais em modo sombra"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: controlled-observatory-cycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controlled-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MAR_AI_EXPERIMENTS_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_ai || 'true' }}
      MAR_AI_SHADOW_MODE: "true"
      MAR_AI_INSTITUTIONAL_USE_ENABLED: "true"
      MAR_AI_COLLECTION_DETECTION_ENABLED: "true"
      MAR_AI_VIDEO_PRESENCE_ENABLED: "true"
      MAR_AI_SYNTHETIC_VIDEO_ENABLED: "false"

    steps:
      - name: Checkout presentation branch
        uses: actions/checkout@v5
        with:
          ref: presentation/rpv-1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and browser
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . pytest
          python -m playwright install --with-deps chromium

      - name: Validate T0A contracts and sample
        run: |
          python -m pytest -q \
            tests/test_ai_experiment_contracts.py \
            tests/test_ai_feature_flags.py \
            tests/test_ai_storage_runtime.py \
            tests/test_ai_baseline_handlers.py \
            tests/test_ai_cycle_integration.py \
            tests/test_ai_validation_sample.py
          python scripts/build_ai_validation_sample.py --check

      - name: Run controlled organism cycle
        id: cycle
        shell: bash
        run: |
          CORPORA_INPUT="${{ inputs.corpora }}"
          if [ -z "$CORPORA_INPUT" ]; then
            CORPORA_INPUT="europeana,ina,bfi"
          fi
          ARGS=(--skip-global-prelude --corpus-timeout 300)
          IFS=',' read -ra CODES <<< "$CORPORA_INPUT"
          for raw_code in "${CODES[@]}"; do
            code=$(echo "$raw_code" | xargs)
            if [ -n "$code" ]; then
              ARGS+=(--corpus "$code")
            fi
          done
          set +e
          python scripts/run_observatory_cycle.py "${ARGS[@]}"
          exit_code=$?
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          echo "Ciclo controlado encerrou com código $exit_code; os artefatos serão preservados."

      - name: Build controlled cycle summary
        if: always()
        env:
          CYCLE_EXIT_CODE: ${{ steps.cycle.outputs.exit_code }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path("data/output")
          ai_root = Path("data/digital_infrastructure/ai_experiments")
          manifest_path = output / "observatorio_ciclo_mensal.json"
          if not manifest_path.exists():
              raise SystemExit(f"manifesto do ciclo ausente: {manifest_path}")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))

          ai_counts = {}
          for path in sorted(ai_root.glob("ai_*.jsonl")):
              ai_counts[path.name] = sum(
                  1 for line in path.read_text(encoding="utf-8").splitlines() if line.strip()
              )

          summary = {
              "cycle": {
                  "exit_code": int(os.environ.get("CYCLE_EXIT_CODE") or 1),
                  "active_corpora_total": manifest.get("active_corpora_total"),
                  "selected_corpora_total": manifest.get("selected_corpora_total"),
                  "successful_corpora_total": manifest.get("successful_corpora_total"),
                  "failed_corpora_total": manifest.get("failed_corpora_total"),
              },
              "ai_shadow_records": ai_counts,
              "ai_is_official_baseline_dependency": False,
          }
          path = output / "controlled_cycle_ai_summary.json"
          path.write_text(json.dumps(summary, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Upload controlled cycle products
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controlled-observatory-cycle-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            data/output/observatorio_ciclo_mensal.json
            data/output/observatorio_linha_do_tempo_ciclos.csv
            data/output/controlled_cycle_ai_summary.json
            data/digital_infrastructure/ai_experiments/*.jsonl

      - name: Report controlled cycle failure
        if: steps.cycle.outputs.exit_code != '0'
        run: |
          echo "O ciclo controlado registrou falhas; consulte o manifesto e o artefato enviado."
          exit 1
