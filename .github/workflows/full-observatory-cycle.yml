name: Full observatory cycle

on:
  push:
    branches:
      - presentation/rpv-1
    paths:
      - ".github/workflows/full-observatory-cycle.yml"
  workflow_dispatch:
    inputs:
      corpus_timeout:
        description: "Tempo máximo por script de corpus, em segundos"
        required: false
        default: "900"
        type: string
      enable_ai:
        description: "Coletar sinais experimentais em modo sombra"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: full-observatory-cycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      MAR_AI_EXPERIMENTS_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_ai || 'true' }}
      MAR_AI_SHADOW_MODE: "true"
      MAR_AI_INSTITUTIONAL_USE_ENABLED: "true"
      MAR_AI_COLLECTION_DETECTION_ENABLED: "true"
      MAR_AI_VIDEO_PRESENCE_ENABLED: "true"
      MAR_AI_SYNTHETIC_VIDEO_ENABLED: "false"

    steps:
      - name: Checkout presentation branch
        uses: actions/checkout@v5
        with:
          ref: presentation/rpv-1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and browser
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . pytest
          python -m playwright install --with-deps chromium

      - name: Validate T0A before full cycle
        run: |
          python -m pytest -q \
            tests/test_ai_experiment_contracts.py \
            tests/test_ai_feature_flags.py \
            tests/test_ai_storage_runtime.py \
            tests/test_ai_baseline_handlers.py \
            tests/test_ai_cycle_integration.py \
            tests/test_ai_validation_sample.py
          python scripts/build_ai_validation_sample.py --check
          python scripts/sync_europe_research_outputs.py --check

      - name: Run all active corpora
        id: cycle
        shell: bash
        run: |
          CORPUS_TIMEOUT="${{ inputs.corpus_timeout }}"
          if [ -z "$CORPUS_TIMEOUT" ]; then
            CORPUS_TIMEOUT="900"
          fi
          set +e
          python scripts/run_observatory_cycle.py --corpus-timeout "$CORPUS_TIMEOUT"
          exit_code=$?
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          echo "Ciclo integral encerrou com código operacional $exit_code; os produtos serão preservados e a completude será validada separadamente."

      - name: Build full cycle summary
        if: always()
        env:
          CYCLE_EXIT_CODE: ${{ steps.cycle.outputs.exit_code }}
        run: |
          python - <<'PY'
          import json
          import os
          from collections import Counter
          from pathlib import Path

          output = Path("data/output")
          ai_root = Path("data/digital_infrastructure/ai_experiments")
          manifest_path = output / "observatorio_ciclo_mensal.json"
          if not manifest_path.exists():
              raise SystemExit(f"manifesto do ciclo ausente: {manifest_path}")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          results = manifest.get("cycle_results") or []
          selected_codes = [str(code) for code in (manifest.get("selected_corpora_codes") or [])]
          result_codes = [str(row.get("code") or "") for row in results]

          ai_counts = {}
          for path in sorted(ai_root.glob("ai_*.jsonl")):
              ai_counts[path.name] = sum(
                  1 for line in path.read_text(encoding="utf-8").splitlines() if line.strip()
              )

          statuses = Counter(str(row.get("status") or "unknown") for row in results)
          non_successful = [
              {
                  "code": row.get("code"),
                  "status": row.get("status"),
                  "error": row.get("error"),
              }
              for row in results
              if row.get("status") != "success"
          ]

          duplicate_codes = sorted(
              code for code, total in Counter(result_codes).items() if code and total > 1
          )
          missing_result_codes = sorted(set(selected_codes) - set(result_codes))
          unexpected_result_codes = sorted(set(result_codes) - set(selected_codes))
          allowed_statuses = {"success", "failed", "not_assessable"}
          invalid_statuses = sorted(set(statuses) - allowed_statuses)

          active_total = int(manifest.get("active_corpora_total") or 0)
          selected_total = int(manifest.get("selected_corpora_total") or 0)
          auditable_completion = (
              manifest.get("cycle_scope") == "completo"
              and active_total > 0
              and selected_total == active_total
              and len(selected_codes) == selected_total
              and len(results) == selected_total
              and not duplicate_codes
              and not missing_result_codes
              and not unexpected_result_codes
              and not invalid_statuses
              and all(result_codes)
          )

          operational_status = (
              "completed"
              if auditable_completion and not non_successful
              else "completed_with_auditable_failures"
              if auditable_completion
              else "incomplete"
          )

          summary = {
              "cycle": {
                  "exit_code": int(os.environ.get("CYCLE_EXIT_CODE") or 1),
                  "cycle_scope": manifest.get("cycle_scope"),
                  "active_corpora_total": active_total,
                  "selected_corpora_total": selected_total,
                  "recorded_results_total": len(results),
                  "successful_corpora_total": manifest.get("successful_corpora_total"),
                  "failed_corpora_total": manifest.get("failed_corpora_total"),
                  "status_counts": dict(statuses),
                  "non_successful_results": non_successful,
                  "operational_status": operational_status,
                  "auditable_completion": auditable_completion,
                  "integrity": {
                      "duplicate_codes": duplicate_codes,
                      "missing_result_codes": missing_result_codes,
                      "unexpected_result_codes": unexpected_result_codes,
                      "invalid_statuses": invalid_statuses,
                  },
              },
              "ai_shadow_records": ai_counts,
              "ai_is_official_baseline_dependency": False,
              "synthetic_video_detection_enabled": False,
          }
          path = output / "full_cycle_ai_summary.json"
          path.write_text(json.dumps(summary, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Upload full cycle products
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-observatory-cycle-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
          path: |
            data/output/**
            data/digital_infrastructure/ai_experiments/*.jsonl
            data/digital_infrastructure/ai_experiments/validation_sample_v1.json

      - name: Validate auditable completion
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/output/full_cycle_ai_summary.json")
          if not path.exists():
              raise SystemExit("Resumo integral ausente; o ciclo não pode ser considerado auditável.")
          summary = json.loads(path.read_text(encoding="utf-8"))
          cycle = summary.get("cycle") or {}
          if not cycle.get("auditable_completion"):
              integrity = cycle.get("integrity") or {}
              raise SystemExit(
                  "Ciclo integral incompleto ou inconsistente: "
                  + json.dumps(integrity, ensure_ascii=False, sort_keys=True)
              )

          non_successful = cycle.get("non_successful_results") or []
          print(
              "Ciclo integral auditavelmente concluído: "
              f"{cycle.get('recorded_results_total')} de {cycle.get('selected_corpora_total')} corpora registrados."
          )
          if non_successful:
              print(
                  f"Atenção: {len(non_successful)} corpora registraram falha ou não avaliabilidade; "
                  "esses estados permanecem no manifesto e não são convertidos em sucesso."
              )
              for row in non_successful:
                  print(f"- {row.get('code')}: {row.get('status')} — {row.get('error') or 'sem detalhe'}")
          PY
