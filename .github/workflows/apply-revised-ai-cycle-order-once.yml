name: Apply Revised AI Cycle Order Once

on:
  push:
    branches:
      - presentation/rpv-1
    paths:
      - .github/workflows/apply-revised-ai-cycle-order-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: presentation/rpv-1

      - name: Apply documentation update
        run: python scripts/apply_revised_ai_cycle_order_once.py

      - name: Commit documentation only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project/BACKLOG.md \
                  docs/roadmap/infrastructure_execution_plan.md \
                  docs/digital-infrastructure-alignment/implementation_backlog.md
          git commit -m "docs: priorizar preparação de IA antes do ciclo"
          git push origin HEAD:presentation/rpv-1
