name: Summarize data output inventory

on:
  push:
    branches:
      - presentation/rpv-1
    paths:
      - ".github/workflows/summarize-data-output.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: presentation/rpv-1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Summarize inventory
        run: |
          python - <<'PY'
          import json
          from collections import defaultdict
          from pathlib import Path

          payload = json.loads(Path('docs/audit/data_output_inventory.json').read_text(encoding='utf-8'))
          files = payload['files']
          expected_suffixes = sorted({
              'instituicoes.csv','resumo_instituicoes.csv','links_video.csv','paginas_internas.csv',
              'resumo_instituicoes_analitico.csv','catalogo_videos_analitico.csv','resumo_disponibilidade.csv',
              'subcategorias_disponibilidade.csv','resumo_visibilidade.csv','resumo_modalidades_acesso.csv',
              'resumo_regimes_acesso.csv','resumo_temas.csv','tema_pais.csv','resumo_tipos_arquivo.csv',
              'tema_plataforma.csv','tema_tipo_arquivo.csv','visibilidade_tipo_arquivo.csv',
              'linha_do_tempo_corpus.csv','linha_do_tempo_instituicoes.csv','sinais_possivel_extincao.csv',
              'snapshot_metadata.json','relatorio.json','relatorio.txt','relatorio.xlsx'
          }, key=len, reverse=True)

          def suffix_for(name):
              return next((s for s in expected_suffixes if name.endswith('_' + s)), None)

          standard, nonstandard = [], []
          by_prefix = defaultdict(list)
          for item in files:
              suffix = suffix_for(item['name'])
              if suffix:
                  standard.append(item)
                  prefix = item['name'][:-(len(suffix)+1)]
                  by_prefix[prefix].append(item)
              else:
                  nonstandard.append(item)

          complete = sorted(p for p, rows in by_prefix.items() if len(rows) == 24)
          incomplete = sorted((p, len(rows)) for p, rows in by_prefix.items() if len(rows) != 24)
          empty_csvs = [f for f in files if f['extension'] == '.csv' and f.get('rows') == 0]
          tiny_csvs = [f for f in files if f['extension'] == '.csv' and (f.get('rows') or 0) <= 1]
          largest = sorted(files, key=lambda x: x['size_bytes'], reverse=True)[:25]
          analytics_terms = ('indicator','analytics','sensitivity','parameter_coverage','methodology_registry','snapshot_indicators','indicator_history')
          analytics_like = [f for f in files if any(term in f['path'].lower() for term in analytics_terms)]

          summary = {
              'file_count': len(files),
              'total_size_bytes': payload['total_size_bytes'],
              'extensions': payload['extensions'],
              'standard_bundle_files': len(standard),
              'nonstandard_files': len(nonstandard),
              'complete_24_file_prefixes': complete,
              'incomplete_prefixes': incomplete,
              'zero_row_csv_count': len(empty_csvs),
              'one_or_zero_row_csv_count': len(tiny_csvs),
              'analytics_like_files': analytics_like,
              'largest_files': largest,
              'nonstandard_file_list': nonstandard,
          }
          Path('docs/audit/data_output_summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')

          lines = [
              '# Síntese do inventário de `data/output`','',
              f'- Arquivos: **{len(files)}**',
              f'- Tamanho total: **{payload["total_size_bytes"]/(1024*1024):.2f} MiB**',
              f'- Arquivos dos pacotes padronizados: **{len(standard)}**',
              f'- Arquivos fora dos pacotes: **{len(nonstandard)}**',
              f'- Corpora com pacote completo de 24 produtos: **{len(complete)}**',
              f'- Corpora com pacote incompleto: **{len(incomplete)}**',
              f'- CSVs sem linhas: **{len(empty_csvs)}**',
              f'- CSVs com zero ou uma linha: **{len(tiny_csvs)}**',
              f'- Produtos da nova camada analítica encontrados em `data/output`: **{len(analytics_like)}**','',
              '## Extensões',''
          ]
          lines += [f'- `{k}`: {v}' for k,v in sorted(payload['extensions'].items())]
          lines += ['', '## Corpora com pacote completo', '', ', '.join(f'`{p}`' for p in complete) or 'Nenhum.']
          lines += ['', '## Corpora com pacote incompleto', '']
          lines += [f'- `{p}`: {n}/24' for p,n in incomplete] if incomplete else ['Nenhum.']
          lines += ['', '## Produtos da nova camada analítica encontrados', '']
          lines += [f'- `{f["path"]}`' for f in analytics_like] if analytics_like else ['- Nenhum arquivo correspondente encontrado.']
          lines += ['', '## Arquivos fora dos pacotes padronizados', '']
          lines += [f'- `{f["path"]}` — {f["size_bytes"]} bytes' for f in nonstandard]
          lines += ['', '## 25 maiores arquivos', '', '| Caminho | MiB | Linhas/itens |', '|---|---:|---:|']
          for f in largest:
              lines.append(f'| `{f["path"]}` | {f["size_bytes"]/(1024*1024):.2f} | {f.get("rows") if f.get("rows") is not None else "—"} |')
          Path('docs/audit/data_output_summary.md').write_text('\n'.join(lines)+'\n', encoding='utf-8')
          PY
      - name: Commit summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audit/data_output_summary.json docs/audit/data_output_summary.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(audit): correct data output summary [skip ci]"
          git push origin HEAD:presentation/rpv-1
