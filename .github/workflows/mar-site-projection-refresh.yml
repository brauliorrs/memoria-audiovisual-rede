name: MAR Scientific Site Projection Refresh

# A draft PR for derived aggregates only. Never merges, publishes objects or runs a collector.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/output/**"
      - "scripts/build_mar_site_research_projections.py"
      - ".github/workflows/mar-site-projection-refresh.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: mar-scientific-site-projections
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'brauliorrs/memoria-audiovisual-rede'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout versioned sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Regenerate derived projections
        run: python3 scripts/build_mar_site_research_projections.py --write
      - name: Regenerate aggregate-only title word cloud
        run: python3 scripts/build_mar_title_wordcloud.py
      - name: Verify scientific consistency and publication boundaries
        run: |
          python3 scripts/build_mar_site_research_projections.py
          python3 scripts/build_mar_title_wordcloud.py --check
          python3 scripts/check_mar_site_index.py
          python3 -m unittest discover -s tests -p 'test_mar_site_snapshot_coherence.py' -v
      - name: Restrict generated changes
        id: generated
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- site/data/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git diff --name-only > /tmp/mar-site-changed
          if grep -Ev '^site/data/(analytics-[0-9]+|research-slices-[0-9]+|institution-profiles-[0-9]+|title-wordcloud)\.json$' /tmp/mar-site-changed; then
            echo "::error::Unexpected generated path"
            exit 1
          fi
      - name: Open human-reviewed draft PR, never auto-merge
        if: steps.generated.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="automation/mar-scientific-site-projections"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" || true
          git switch -C "$BRANCH" "$GITHUB_SHA"
          git add -- site/data/
          git diff --cached --name-only > /tmp/mar-site-staged
          if grep -Ev '^site/data/(analytics-[0-9]+|research-slices-[0-9]+|institution-profiles-[0-9]+|title-wordcloud)\.json$' /tmp/mar-site-staged; then
            echo "::error::Unexpected staged file"
            exit 1
          fi
          git commit -m "data(MAR): refresh audited scientific site projections"
          git push --force-with-lease origin "HEAD:refs/heads/$BRANCH"
          PR="$(gh pr list --state open --head "$BRANCH" --json number --jq '.[0].number // empty')"
          if test -z "$PR"; then
            gh pr create --draft --base main --head "$BRANCH" \
              --title "data(MAR): revisar projeções científicas estáticas" \
              --body "PR de indicadores, tabelas e perfis derivados dos snapshots versionados. REVISÃO HUMANA obrigatória antes de integrar. Não publica fichas sob HOLD, não autoriza mídia, não remove proteção SSO e não cria projeto Vercel. Conferir diffs, licenças, números, hashes e proveniência."
          fi
