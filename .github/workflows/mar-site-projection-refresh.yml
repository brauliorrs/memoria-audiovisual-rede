name: MAR Scientific Site Projection Refresh
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
  push:
    branches: [main]
    paths:
      - "data/output/**"
      - "site/data/kavi-public.json"
      - "scripts/build_mar_title_wordcloud.py"
      - "scripts/build_mar_site_research_projections.py"
      - ".github/workflows/mar-site-projection-refresh.yml"
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: mar-scientific-site-projections
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'brauliorrs/memoria-audiovisual-rede'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout versioned sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Regenerate approved aggregate projections only
        run: |
          python3 scripts/build_mar_site_research_projections.py --write
          python3 scripts/build_mar_title_wordcloud.py
      - name: Verify scientific and publication contracts
        run: |
          python3 scripts/build_mar_site_research_projections.py
          python3 scripts/build_mar_title_wordcloud.py --check
          python3 scripts/check_mar_site_index.py
          python3 -m unittest discover -s tests -p 'test_mar_site_snapshot_coherence.py' -v
      - name: Pin source provenance on refreshed projections
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if ! git diff --quiet -- site/data/analytics-*.json site/data/research-slices-*.json site/data/institution-profiles-*.json; then
            python3 scripts/pin_mar_site_research_snapshot.py --source-sha "$SOURCE_SHA"
          fi
      - name: Allowlist changes
        id: changes
        run: |
          set -euo pipefail
          if git diff --quiet -- site/data/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only > /tmp/mar-changed
          if grep -Ev '^site/(data/(analytics-[0-9]+|research-slices-[0-9]+|institution-profiles-[0-9]+|title-wordcloud)\.json|lib/research-snapshot\.ts)$' /tmp/mar-changed; then
            echo "::error::Unexpected generated path"
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Open draft PR without auto-merge
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="automation/mar-scientific-site-projections"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" || true
          git switch -C "$BRANCH" "$GITHUB_SHA"
          git add -- site/data/ site/lib/research-snapshot.ts
          git diff --cached --name-only > /tmp/mar-staged
          if grep -Ev '^site/(data/(analytics-[0-9]+|research-slices-[0-9]+|institution-profiles-[0-9]+|title-wordcloud)\.json|lib/research-snapshot\.ts)$' /tmp/mar-staged; then
            echo "::error::Unexpected staged file"
            exit 1
          fi
          git commit -m "data(MAR): refresh versioned scientific site projections"
          git push --force-with-lease origin "HEAD:refs/heads/$BRANCH"
          PR="$(gh pr list --state open --head "$BRANCH" --json number --jq '.[0].number // empty')"
          if test -z "$PR"; then
            gh pr create --draft --base main --head "$BRANCH" \
              --title "data(MAR): revisar projeções científicas do site" \
              --body "Revisão humana obrigatória. Apenas indicadores agregados e perfis institucionais, sem fichas sob HOLD, mídia, novas permissões ou abertura pública. Conferir diffs, SHA, política de direitos e proveniência."
          # PRs opened with GITHUB_TOKEN do not start pull_request CI automatically.
          gh workflow run mar-site.yml --ref "$BRANCH"
          gh workflow run quality.yml --ref "$BRANCH"
          gh workflow run mar-title-wordcloud.yml --ref "$BRANCH"
          fi
