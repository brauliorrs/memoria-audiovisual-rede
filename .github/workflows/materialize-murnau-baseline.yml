name: Materialize Murnau baseline

on:
  push:
    branches:
      - corpus/murnau-stiftung-v1

permissions:
  contents: write

concurrency:
  group: murnau-baseline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: "!contains(github.event.head_commit.message, '[murnau-baseline]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: corpus/murnau-stiftung-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Materialize and validate baseline
        run: |
          python scripts/run_murnau_stiftung_pipeline.py
          python scripts/check_murnau_stiftung_outputs.py

      - name: Commit validated baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/output/murnau_stiftung_*
          git diff --cached --quiet && {
            echo "No baseline changes to commit."
            exit 0
          }
          git commit -m "data(murnau): persist validated public-catalog baseline [murnau-baseline]"
          git push origin HEAD:corpus/murnau-stiftung-v1
