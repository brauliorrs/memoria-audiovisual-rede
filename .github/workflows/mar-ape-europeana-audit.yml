name: MAR APE Europeana Documentary Audit

on:
  pull_request:
    paths:
      - "scripts/audit_mar_ape_europeana_records.py"
      - "tests/test_mar_ape_europeana_records.py"
      - ".github/workflows/mar-ape-europeana-audit.yml"
      - "data/output/europeana_catalogo_videos_analitico.csv"
      - "data/output/ape_catalogo_videos_analitico.csv"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-historical-records:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit all 20 Europeana and 412 APE source rows
        run: python scripts/audit_mar_ape_europeana_records.py --output /tmp/mar-ape-europeana-record-review.json
      - name: Confirm fail-closed rights and provenance rules
        run: python -m unittest discover -s tests -p 'test_mar_ape_europeana_records.py' -v
      - name: Archive quarantined per-record review
        uses: actions/upload-artifact@v4
        with:
          name: mar-ape-europeana-per-record-review
          path: /tmp/mar-ape-europeana-record-review.json
          retention-days: 30
          if-no-files-found: error
      - name: Verify KAVI public index unchanged
        run: python scripts/check_mar_site_index.py
