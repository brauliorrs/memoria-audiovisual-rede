name: Quality Checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - presentation/rpv-1

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . pytest

      - name: Compile Python sources
        run: python -m compileall -q app src scripts

      - name: Run tests
        run: python -m pytest -q

      - name: Validate reference corpus manifest
        run: python scripts/audit_reference_corpus_manifest.py

      - name: Validate derived reference corpus inventory
        run: python scripts/build_reference_corpus_inventory.py --check

      - name: Validate scientific snapshot
        run: python scripts/audit_scientific_snapshot.py

      - name: Audit methodology consistency
        run: python scripts/audit_methodology_consistency.py

      - name: Audit scientific integrity
        run: python scripts/audit_scientific_integrity.py

      - name: Check deployment snapshot
        run: python scripts/check_deployment_ready.py
