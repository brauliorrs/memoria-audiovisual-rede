name: Quality Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  refactor-digital-infrastructure:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/fase2-adaptador-auditoria-infraestrutura'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da branch do PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/fase2-adaptador-auditoria-infraestrutura

      - name: Refatorar caminhos e referências
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/refactor-digital-infrastructure.yml')
          tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          moves = []
          for raw in tracked:
              old = Path(raw)
              if old == workflow or old == Path('.github/workflows/quality.yml'):
                  continue
              if old == Path('.github/workflows/statetech-periodic-review.yml'):
                  new = Path('.github/workflows/digital-infrastructure-periodic-review.yml')
              else:
                  new = Path(*[
                      part.replace('statetech-alignment', 'digital-infrastructure-alignment')
                          .replace('statetech', 'digital_infrastructure')
                          .replace('STATETECH', 'DIGITAL_INFRASTRUCTURE')
                      for part in old.parts
                  ])
              if new != old:
                  moves.append((old, new))

          for old, new in sorted(moves, key=lambda item: len(item[0].parts), reverse=True):
              if old.exists():
                  new.parent.mkdir(parents=True, exist_ok=True)
                  subprocess.run(['git', 'mv', str(old), str(new)], check=True)

          replacements = [
              ('STATETECH_HISTORY_BRANCH', 'DIGITAL_INFRASTRUCTURE_HISTORY_BRANCH'),
              ('STATETECH_STATE_DIR', 'DIGITAL_INFRASTRUCTURE_STATE_DIR'),
              ('.statetech-history', '.digital-infrastructure-history'),
              ('statetech-history', 'digital-infrastructure-history'),
              ('statetech-periodic-review', 'digital-infrastructure-periodic-review'),
              ('statetech-', 'digital-infrastructure-'),
              ('data/statetech', 'data/digital_infrastructure'),
              ('docs/statetech-alignment', 'docs/digital-infrastructure-alignment'),
              ('src/memoria_audiovisual/statetech', 'src/memoria_audiovisual/digital_infrastructure'),
              ('memoria_audiovisual.statetech', 'memoria_audiovisual.digital_infrastructure'),
              ('scripts/build_statetech_', 'scripts/build_digital_infrastructure_'),
              ('scripts/postflight_statetech_', 'scripts/postflight_digital_infrastructure_'),
              ('scripts/preflight_statetech_', 'scripts/preflight_digital_infrastructure_'),
              ('scripts/prepare_statetech_', 'scripts/prepare_digital_infrastructure_'),
              ('scripts/review_statetech_', 'scripts/review_digital_infrastructure_'),
              ('scripts/triage_statetech_', 'scripts/triage_digital_infrastructure_'),
              ('test_statetech_', 'test_digital_infrastructure_'),
              ('Estado–tecnologia', 'infraestrutura digital'),
              ('Estado-tecnologia', 'infraestrutura digital'),
              ('STATETECH', 'DIGITAL_INFRASTRUCTURE'),
              ('Statetech', 'Infraestrutura Digital'),
              ('statetech', 'digital_infrastructure'),
          ]
          binary_suffixes = {'.png', '.jpg', '.jpeg', '.gif', '.ico', '.pdf', '.zip', '.gz', '.parquet'}
          for raw in subprocess.check_output(['git', 'ls-files'], text=True).splitlines():
              path = Path(raw)
              if path in {workflow, Path('.github/workflows/quality.yml')} or not path.exists() or path.suffix.lower() in binary_suffixes:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          if workflow.exists():
              subprocess.run(['git', 'rm', str(workflow)], check=True)
          subprocess.run(['git', 'checkout', 'origin/main', '--', '.github/workflows/quality.yml'], check=True)
          PY

      - name: Verificar refatoração
        shell: bash
        run: |
          set -euo pipefail
          if git grep -ni -I -E 'statetech|estado[–-]tecnologia' -- . ':!*.lock'; then
            exit 1
          fi
          if git ls-files | grep -i 'statetech'; then
            exit 1
          fi
          python -m compileall -q src scripts tests

      - name: Commitar e enviar
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: substituir nomenclatura por infraestrutura digital'
          git push origin HEAD:feature/fase2-adaptador-auditoria-infraestrutura

  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Compile Python modules
        run: |
          python -m py_compile app/streamlit_app.py
          python -m py_compile src/memoria_audiovisual/aamod.py
          python -m py_compile src/memoria_audiovisual/aamod_exports.py
          python -m py_compile src/memoria_audiovisual/anf.py
          python -m py_compile src/memoria_audiovisual/anf_exports.py
          python -m py_compile src/memoria_audiovisual/adlibitum_protocol.py
          python -m py_compile src/memoria_audiovisual/analysis.py
          python -m py_compile src/memoria_audiovisual/ape_exports.py
          python -m py_compile src/memoria_audiovisual/archipop.py
          python -m py_compile src/memoria_audiovisual/archipop_exports.py
          python -m py_compile src/memoria_audiovisual/dashboard_data.py
          python -m py_compile src/memoria_audiovisual/discovery.py
          python -m py_compile src/memoria_audiovisual/european_aggregators.py
          python -m py_compile src/memoria_audiovisual/europe_closure.py
          python -m py_compile src/memoria_audiovisual/european_protocols.py
          python -m py_compile src/memoria_audiovisual/euscreen.py
          python -m py_compile src/memoria_audiovisual/euscreen_exports.py
          python -m py_compile src/memoria_audiovisual/output_files.py
          python -m py_compile src/memoria_audiovisual/organism.py
          python -m py_compile src/memoria_audiovisual/pares.py
          python -m py_compile src/memoria_audiovisual/pares_exports.py
          python -m py_compile src/memoria_audiovisual/pipeline.py
          python -m py_compile src/memoria_audiovisual/snapshot_metadata.py
          python -m py_compile src/memoria_audiovisual/sfa.py
          python -m py_compile src/memoria_audiovisual/sfa_exports.py
          python -m py_compile src/memoria_audiovisual/timeline.py
          python -m py_compile scripts/build_ape_analytics.py
          python -m py_compile scripts/build_euscreen_analytics.py
          python -m py_compile scripts/build_ina_analytics.py
          python -m py_compile scripts/build_pares_analytics.py
          python -m py_compile scripts/build_europe_closure_report.py
          python -m py_compile scripts/check_aamod_outputs.py
          python -m py_compile scripts/check_archipop_outputs.py
          python -m py_compile scripts/check_ape_outputs.py
          python -m py_compile scripts/check_euscreen_outputs.py
          python -m py_compile scripts/check_ina_outputs.py
          python -m py_compile scripts/check_deployment_ready.py
          python -m py_compile scripts/check_observatory_cycle.py
          python -m py_compile scripts/check_pares_outputs.py
          python -m py_compile scripts/evaluate_european_aggregators.py
          python -m py_compile scripts/prototype_archiveshub_protocol.py
          python -m py_compile scripts/prototype_francearchives_protocol.py
          python -m py_compile scripts/run_euscreen_pipeline.py
          python -m py_compile scripts/run_aamod_pipeline.py
          python -m py_compile scripts/run_anf_pipeline.py
          python -m py_compile scripts/run_adlibitum_protocol.py
          python -m py_compile scripts/run_archipop_pipeline.py
          python -m py_compile scripts/run_ina_pipeline.py
          python -m py_compile scripts/run_observatory_cycle.py
          python -m py_compile scripts/run_pares_pipeline.py
          python -m py_compile scripts/run_sfa_pipeline.py
          python -m py_compile scripts/check_anf_outputs.py
          python -m py_compile scripts/check_sfa_outputs.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check deployment snapshot
        run: python scripts/check_deployment_ready.py
