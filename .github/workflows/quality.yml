name: Quality Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Check dependency manifests
        run: python scripts/check_dependency_manifests.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Lint canonical infrastructure
        run: |
          ruff check --select E9,F63,F7,F82 src/memoria_audiovisual/digital_infrastructure
          ruff check \
            src/memoria_audiovisual/digital_infrastructure/adapters.py \
            src/memoria_audiovisual/digital_infrastructure/ingestion.py \
            src/memoria_audiovisual/digital_infrastructure/ingestion_batches.py \
            src/memoria_audiovisual/digital_infrastructure/raw_artifacts.py \
            tests/test_digital_infrastructure_ingestion.py \
            tests/test_digital_infrastructure_ingestion_artifacts.py

      - name: Check formatting for Wave 2A scope
        run: |
          ruff format --check \
            src/memoria_audiovisual/digital_infrastructure/adapters.py \
            src/memoria_audiovisual/digital_infrastructure/ingestion.py \
            src/memoria_audiovisual/digital_infrastructure/ingestion_batches.py \
            src/memoria_audiovisual/digital_infrastructure/raw_artifacts.py \
            tests/test_digital_infrastructure_ingestion.py \
            tests/test_digital_infrastructure_ingestion_artifacts.py

      - name: Type-check Wave 2A scope
        run: |
          mypy --follow-imports=skip \
            src/memoria_audiovisual/digital_infrastructure/adapters.py \
            src/memoria_audiovisual/digital_infrastructure/ingestion.py \
            src/memoria_audiovisual/digital_infrastructure/ingestion_batches.py \
            src/memoria_audiovisual/digital_infrastructure/raw_artifacts.py

      - name: Enforce Wave 2A coverage floor
        run: |
          coverage erase
          coverage run --branch -m pytest -q \
            tests/test_digital_infrastructure_ingestion.py \
            tests/test_digital_infrastructure_ingestion_artifacts.py
          coverage report \
            --include="*/digital_infrastructure/adapters.py,*/digital_infrastructure/ingestion.py,*/digital_infrastructure/ingestion_batches.py,*/digital_infrastructure/raw_artifacts.py" \
            --show-missing

      - name: Compile Python modules
        run: |
          python -m py_compile app/streamlit_app.py
          python -m py_compile src/memoria_audiovisual/aamod.py
          python -m py_compile src/memoria_audiovisual/aamod_exports.py
          python -m py_compile src/memoria_audiovisual/anf.py
          python -m py_compile src/memoria_audiovisual/anf_exports.py
          python -m py_compile src/memoria_audiovisual/adlibitum_protocol.py
          python -m py_compile src/memoria_audiovisual/analysis.py
          python -m py_compile src/memoria_audiovisual/ape_exports.py
          python -m py_compile src/memoria_audiovisual/archipop.py
          python -m py_compile src/memoria_audiovisual/archipop_exports.py
          python -m py_compile src/memoria_audiovisual/dashboard_data.py
          python -m py_compile src/memoria_audiovisual/discovery.py
          python -m py_compile src/memoria_audiovisual/european_aggregators.py
          python -m py_compile src/memoria_audiovisual/europe_closure.py
          python -m py_compile src/memoria_audiovisual/european_protocols.py
          python -m py_compile src/memoria_audiovisual/euscreen.py
          python -m py_compile src/memoria_audiovisual/euscreen_exports.py
          python -m py_compile src/memoria_audiovisual/output_files.py
          python -m py_compile src/memoria_audiovisual/organism.py
          python -m py_compile src/memoria_audiovisual/pares.py
          python -m py_compile src/memoria_audiovisual/pares_exports.py
          python -m py_compile src/memoria_audiovisual/pipeline.py
          python -m py_compile src/memoria_audiovisual/snapshot_metadata.py
          python -m py_compile src/memoria_audiovisual/sfa.py
          python -m py_compile src/memoria_audiovisual/sfa_exports.py
          python -m py_compile src/memoria_audiovisual/timeline.py
          python -m compileall -q src/memoria_audiovisual/digital_infrastructure
          python -m py_compile src/memoria_audiovisual/statetech/digital_infrastructure_adapter.py
          python -m py_compile src/memoria_audiovisual/statetech/digital_infrastructure_review.py
          python -m py_compile scripts/audit_digital_infrastructure.py
          python -m py_compile scripts/build_ape_analytics.py
          python -m py_compile scripts/build_euscreen_analytics.py
          python -m py_compile scripts/build_ina_analytics.py
          python -m py_compile scripts/build_pares_analytics.py
          python -m py_compile scripts/build_europe_closure_report.py
          python -m py_compile scripts/check_aamod_outputs.py
          python -m py_compile scripts/check_archipop_outputs.py
          python -m py_compile scripts/check_ape_outputs.py
          python -m py_compile scripts/check_euscreen_outputs.py
          python -m py_compile scripts/check_ina_outputs.py
          python -m py_compile scripts/check_dependency_manifests.py
          python -m py_compile scripts/check_deployment_ready.py
          python -m py_compile scripts/check_observatory_cycle.py
          python -m py_compile scripts/check_pares_outputs.py
          python -m py_compile scripts/evaluate_european_aggregators.py
          python -m py_compile scripts/prototype_archiveshub_protocol.py
          python -m py_compile scripts/prototype_francearchives_protocol.py
          python -m py_compile scripts/run_euscreen_pipeline.py
          python -m py_compile scripts/run_aamod_pipeline.py
          python -m py_compile scripts/run_anf_pipeline.py
          python -m py_compile scripts/run_adlibitum_protocol.py
          python -m py_compile scripts/run_archipop_pipeline.py
          python -m py_compile scripts/run_ina_pipeline.py
          python -m py_compile scripts/run_observatory_cycle.py
          python -m py_compile scripts/run_pares_pipeline.py
          python -m py_compile scripts/run_sfa_pipeline.py
          python -m py_compile scripts/check_anf_outputs.py
          python -m py_compile scripts/check_sfa_outputs.py

      - name: Validate Gosfilmofond technical probe contract
        run: |
          ruff check --select E9,F63,F7,F82 \
            src/memoria_audiovisual/gosfilmofond_probe.py \
            scripts/probe_gosfilmofond_catalog.py \
            tests/test_gosfilmofond_probe.py
          python -m unittest discover -s tests -p 'test_gosfilmofond_probe.py' -v

      - name: Probe Gosfilmofond public catalogue
        if: github.event_name == 'pull_request' && github.head_ref == 'corpus/gosfilmofond-probe-v1'
        run: python scripts/probe_gosfilmofond_catalog.py

      - name: Upload Gosfilmofond probe artifact
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'corpus/gosfilmofond-probe-v1'
        uses: actions/upload-artifact@v4
        with:
          name: gosfilmofond-catalog-probe
          path: data/output/gosfilmofond_catalog_probe.json
          if-no-files-found: error

      - name: Validate IFI Archive Player technical probe contract
        run: |
          ruff check --select E9,F63,F7,F82 \
            src/memoria_audiovisual/ifi_archive_player_probe.py \
            scripts/probe_ifi_archive_player.py \
            tests/test_ifi_archive_player_probe.py
          python -m unittest discover -s tests -p 'test_ifi_archive_player_probe.py' -v

      - name: Probe IFI Archive Player public discovery surfaces
        if: github.event_name == 'pull_request' && github.head_ref == 'corpus/ifi-irish-film-archive-probe-v1'
        run: python scripts/probe_ifi_archive_player.py

      - name: Upload IFI Archive Player probe artifact
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'corpus/ifi-irish-film-archive-probe-v1'
        uses: actions/upload-artifact@v4
        with:
          name: ifi-archive-player-probe
          path: data/output/ifi_archive_player_probe.json
          if-no-files-found: error

      - name: Validate IFI Archive Player staged collector
        run: |
          ruff check --select E9,F63,F7,F82 \
            src/memoria_audiovisual/ifi_archive_player.py \
            src/memoria_audiovisual/ifi_archive_player_exports.py \
            scripts/run_ifi_archive_player_pipeline.py \
            scripts/check_ifi_archive_player_outputs.py \
            tests/test_ifi_archive_player_collection.py
          python -m unittest discover -s tests -p 'test_ifi_archive_player_collection.py' -v

      - name: Validate IFI Archive Player canonical baseline
        run: python scripts/check_ifi_archive_player_outputs.py

      - name: Run IFI Archive Player staged baseline
        if: github.event_name == 'pull_request' && github.head_ref == 'corpus/ifi-irish-film-archive-v1'
        run: python scripts/run_ifi_archive_player_pipeline.py

      - name: Upload IFI Archive Player staged baseline
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'corpus/ifi-irish-film-archive-v1'
        uses: actions/upload-artifact@v4
        with:
          name: ifi-archive-player-staged-baseline
          path: data/output/ifi_archive_player_*
          if-no-files-found: error

      - name: Validate IFI Archive Player staged baseline
        if: github.event_name == 'pull_request' && github.head_ref == 'corpus/ifi-irish-film-archive-v1'
        run: python scripts/check_ifi_archive_player_outputs.py

      - name: Regenerate IFI promotion queue outputs
        if: github.event_name == 'pull_request' && github.head_ref == 'corpus/ifi-irish-film-archive-v1'
        run: |
          python - <<'PY'
          from memoria_audiovisual.config import OUTPUT_DIR
          from memoria_audiovisual.europe_research import write_europe_research_outputs
          from memoria_audiovisual.inclusion_queue import write_next_inclusion_candidates

          write_europe_research_outputs(OUTPUT_DIR)
          write_next_inclusion_candidates(output_dir=OUTPUT_DIR, limit=3)
          PY

      - name: Upload IFI promotion queue outputs
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'corpus/ifi-irish-film-archive-v1'
        uses: actions/upload-artifact@v4
        with:
          name: ifi-promotion-queue
          path: |
            data/output/observatorio_pesquisa_europa.csv
            data/output/observatorio_fila_pesquisa_europa.csv
            data/output/observatorio_resumo_pesquisa_europa.csv
            data/output/observatorio_proximos_candidatos_inclusao.json
          if-no-files-found: error

      - name: Validate Image'Est technical probe contract
        run: |
          ruff check --select E9,F63,F7,F82 \
            src/memoria_audiovisual/image_est_probe.py \
            scripts/probe_image_est.py \
            tests/test_image_est_probe.py
          python -m unittest discover -s tests -p 'test_image_est_probe.py' -v

      - name: Probe Image'Est public film catalogue
        if: github.event_name == 'pull_request' && github.head_ref == 'corpus/image-est-probe-v1'
        run: python scripts/probe_image_est.py

      - name: Upload Image'Est probe artifact
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'corpus/image-est-probe-v1'
        uses: actions/upload-artifact@v4
        with:
          name: image-est-probe
          path: data/output/image_est_probe.json
          if-no-files-found: error

      - name: Validate Image'Est staged collector
        run: |
          ruff check --select E9,F63,F7,F82 \
            src/memoria_audiovisual/image_est.py \
            src/memoria_audiovisual/image_est_exports.py \
            scripts/run_image_est_pipeline.py \
            scripts/check_image_est_outputs.py \
            tests/test_image_est_collection.py
          python -m unittest discover -s tests -p 'test_image_est_collection.py' -v

      - name: Validate Image'Est canonical baseline
        run: python scripts/check_image_est_outputs.py

      - name: Run Image'Est staged baseline
        if: github.event_name == 'pull_request' && github.head_ref == 'corpus/image-est-v1'
        run: python scripts/run_image_est_pipeline.py

      - name: Upload Image'Est staged baseline
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'corpus/image-est-v1'
        uses: actions/upload-artifact@v4
        with:
          name: image-est-staged-baseline
          path: data/output/image_est_*
          if-no-files-found: error

      - name: Validate Image'Est staged baseline
        if: github.event_name == 'pull_request' && github.head_ref == 'corpus/image-est-v1'
        run: python scripts/check_image_est_outputs.py

      - name: Validate IWM Film technical probe contract
        run: |
          ruff check --select E9,F63,F7,F82 \
            src/memoria_audiovisual/iwm_film_probe.py \
            scripts/probe_iwm_film.py \
            tests/test_iwm_film_probe.py
          python -m unittest discover -s tests -p 'test_iwm_film_probe.py' -v

      - name: Probe IWM Film public discovery surfaces
        if: github.event_name == 'pull_request' && github.head_ref == 'corpus/iwm-film-archive-probe-v1'
        run: python scripts/probe_iwm_film.py

      - name: Upload IWM Film probe artifact
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'corpus/iwm-film-archive-probe-v1'
        uses: actions/upload-artifact@v4
        with:
          name: iwm-film-probe
          path: data/output/iwm_film_probe.json
          if-no-files-found: error

      - name: Validate IWM Film staged collector
        run: |
          ruff check --select E9,F63,F7,F82 \
            src/memoria_audiovisual/iwm_film.py \
            src/memoria_audiovisual/iwm_film_exports.py \
            scripts/run_iwm_film_pipeline.py \
            scripts/check_iwm_film_outputs.py \
            tests/test_iwm_film_collection.py
          python -m unittest discover -s tests -p 'test_iwm_film_collection.py' -v

      - name: Run IWM Film staged baseline
        if: github.event_name == 'pull_request' && (github.head_ref == 'corpus/iwm-film-archive-v1' || github.head_ref == 'corpus/iwm-film-archive-promote-v1')
        run: python scripts/run_iwm_film_pipeline.py

      - name: Upload IWM Film staged baseline
        if: always() && github.event_name == 'pull_request' && (github.head_ref == 'corpus/iwm-film-archive-v1' || github.head_ref == 'corpus/iwm-film-archive-promote-v1')
        uses: actions/upload-artifact@v4
        with:
          name: iwm-film-staged-baseline
          path: data/output/iwm_film_*
          if-no-files-found: error

      - name: Validate IWM Film staged baseline
        if: github.event_name == 'pull_request' && (github.head_ref == 'corpus/iwm-film-archive-v1' || github.head_ref == 'corpus/iwm-film-archive-promote-v1')
        run: python scripts/check_iwm_film_outputs.py

      - name: Validate Jean Vigo technical probe contract
        run: |
          ruff check --select E9,F63,F7,F82 \
            src/memoria_audiovisual/jean_vigo_probe.py \
            scripts/probe_jean_vigo.py \
            tests/test_jean_vigo_probe.py
          python -m unittest discover -s tests -p 'test_jean_vigo_probe.py' -v

      - name: Probe Jean Vigo public discovery surfaces
        if: github.event_name == 'pull_request' && github.head_ref == 'corpus/jean-vigo-probe-v1'
        run: python scripts/probe_jean_vigo.py

      - name: Upload Jean Vigo probe artifact
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'corpus/jean-vigo-probe-v1'
        uses: actions/upload-artifact@v4
        with:
          name: jean-vigo-probe
          path: data/output/jean_vigo_probe.json
          if-no-files-found: error

      - name: Validate Mémoire Filmique subordinate probe contract
        run: |
          ruff check --select E9,F63,F7,F82 \
            src/memoria_audiovisual/memoire_filmique_probe.py \
            scripts/probe_memoire_filmique.py \
            tests/test_memoire_filmique_probe.py
          python -m unittest discover -s tests -p 'test_memoire_filmique_probe.py' -v

      - name: Probe Mémoire Filmique subordinate public catalogue
        if: github.event_name == 'pull_request' && github.head_ref == 'corpus/jean-vigo-probe-v1'
        run: python scripts/probe_memoire_filmique.py

      - name: Upload Mémoire Filmique subordinate probe artifact
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'corpus/jean-vigo-probe-v1'
        uses: actions/upload-artifact@v4
        with:
          name: memoire-filmique-probe
          path: data/output/memoire_filmique_probe.json
          if-no-files-found: error

      - name: Validate Jean Vigo HOLD queue transition
        if: github.event_name == 'pull_request' && github.head_ref == 'corpus/jean-vigo-probe-v1'
        run: |
          python -m unittest discover -s tests -p 'test_europe_research.py' -v
          python scripts/build_europe_research_queue.py
          python scripts/next_inclusion_candidate.py --limit 3

      - name: Upload Jean Vigo HOLD queue outputs
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'corpus/jean-vigo-probe-v1'
        uses: actions/upload-artifact@v4
        with:
          name: jean-vigo-hold-queue-outputs
          path: |
            data/output/observatorio_pesquisa_europa.csv
            data/output/observatorio_fila_pesquisa_europa.csv
            data/output/observatorio_resumo_pesquisa_europa.csv
            data/output/observatorio_proximos_candidatos_inclusao.json
          if-no-files-found: error

      - name: Validate KAVI Finna two-page resume and provenance gates
        run: |
          ruff check --select E9,F63,F7,F82 \
            scripts/probe_kavi_finna_two_page_resume.py \
            tests/test_kavi_finna_two_page_resume.py
          python -m unittest discover -s tests -p 'test_kavi_finna_two_page_resume.py' -v

      - name: Probe live KAVI Finna two-page resumption (no media)
        if: github.event_name == 'pull_request' && github.head_ref == 'corpus/kavi-finna-resumption-integrity-v1'
        run: |
          mkdir -p data/output
          python scripts/probe_kavi_finna_two_page_resume.py \
            --evidence-sha256 466006cb7a499efff354e7f4425aface044440218bdb9a20a1550a3fe079e049 \
            --execute > data/output/kavi_finna_two_page_public.json
          python -m json.tool data/output/kavi_finna_two_page_public.json

      - name: Upload KAVI Finna redacted two-page integrity summary
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'corpus/kavi-finna-resumption-integrity-v1'
        uses: actions/upload-artifact@v4
        with:
          name: kavi-finna-two-page-public-probe
          path: data/output/kavi_finna_two_page_public.json
          if-no-files-found: warn

      - name: Validate KAVI Finna isolated recovery epochs (offline)
        run: |
          ruff check --select E9,F63,F7,F82 \
            scripts/kavi_finna_epoch_recovery.py \
            tests/test_kavi_finna_epoch_recovery.py \
            src/memoria_audiovisual/metadata_staging.py
          python -m unittest discover -s tests -p 'test_kavi_finna_epoch_recovery.py' -v

      - name: Validate KAVI Finna three-batch server-authority resume (offline)
        run: |
          ruff check --select E9,F63,F7,F82 \
            scripts/kavi_finna_batch_gate.py \
            scripts/probe_kavi_finna_three_batch_resume.py \
            scripts/finna_expiry_hypotheses.py \
            tests/test_kavi_finna_three_batch_resume.py \
            tests/test_finna_expiry_hypotheses.py \
            tests/test_kavi_finna_batch_gate.py
          python -m unittest discover -s tests -p 'test_kavi_finna_three_batch_resume.py' -v
          python -m unittest discover -s tests -p 'test_finna_expiry_hypotheses.py' -v
          python -m unittest discover -s tests -p 'test_kavi_finna_batch_gate.py' -v

      # The live --execute three-page probe is NOT run in ordinary PR CI.
      # It requires a later, deliberate, branch-restricted execution after
      # the offline gate and a new source/rights review.

      - name: Validate KAVI Finna failure taxonomy (offline, no automatic restart)
        run: |
          ruff check --select E9,F63,F7,F82 \
            src/memoria_audiovisual/finna_response_classifier.py \
            src/memoria_audiovisual/kavi_finna_adapter.py \
            src/memoria_audiovisual/kavi_elonet_probe.py \
            scripts/run_kavi_finna_metadata_staging.py \
            tests/test_finna_response_classifier.py
          python -m unittest discover -s tests -p 'test_finna_response_classifier.py' -v

      - name: Validate public-access-first discovery gate (offline)
        run: |
          ruff check --select E9,F63,F7,F82 \
            scripts/validate_public_access_survey.py \
            tests/test_public_access_survey.py
          python -m unittest discover -s tests -p 'test_public_access_survey.py' -v

      - name: Validate KAVI incremental cross-epoch review plan (offline only)
        run: |
          ruff check --select E9,F63,F7,F82 \
            src/memoria_audiovisual/kavi_finna_incremental_plan.py \
            tests/test_kavi_finna_incremental_plan.py
          python -m unittest discover -s tests -p 'test_kavi_finna_incremental_plan.py' -v

      - name: Validate KAVI documentary metadata reporting (impact plan A1-A13)
        run: |
          ruff check --select E9,F63,F7,F82 \
            src/memoria_audiovisual/kavi_finna_metadata_reports.py \
            scripts/build_kavi_kuvi_metadata_reports.py \
            tests/test_kavi_kuvi_metadata_reports.py
          python -m unittest discover -s tests -p 'test_kavi_kuvi_metadata_reports.py' -v
          python -m unittest discover -s tests -p 'test_i18n.py' -v
          python -m scripts.build_kavi_kuvi_metadata_reports --check
          python -m py_compile app/streamlit_app.py

      - name: Validate normalized KAVI corpus registry and index (offline)
        run: |
          ruff check --select E9,F63,F7,F82 \
            src/memoria_audiovisual/kavi_finna_registry.py \
            scripts/check_kavi_kuvi_index.py \
            tests/test_kavi_kuvi_registry.py
          python -m unittest discover -s tests -p 'test_kavi_kuvi_registry.py' -v
          python -m scripts.check_kavi_kuvi_index

      - name: Validate published KAVI metadata index integrity and safety (offline)
        run: |
          ruff check --select E9,F63,F7,F82 \
            src/memoria_audiovisual/kavi_finna_public_catalog.py \
            tests/test_kavi_finna_public_catalog.py
          python -m unittest discover -s tests -p 'test_kavi_finna_public_catalog.py' -v
          python - <<'PY'
          from pathlib import Path
          from memoria_audiovisual.kavi_finna_public_catalog import load_published_kavi_rows
          root = Path("data/output")
          rows, metadata = load_published_kavi_rows(root)
          if (root / "kavi_mar_metadata_links.csv").exists() and not rows:
              raise SystemExit("kavi_metadata_index_present_but_empty")
          if rows:
              print("KAVI metadata index verified:", len(rows))
              if metadata["corpus_activation"] is not False:
                  raise SystemExit("unexpected_corpus_activation")
          PY

      - name: Validate KAVI link-only MAR metadata projection (offline)
        run: |
          ruff check --select E9,F63,F7,F82 \
            src/memoria_audiovisual/kavi_finna_mar_index.py \
            scripts/project_kavi_finna_mar_index.py \
            tests/test_kavi_finna_mar_index.py
