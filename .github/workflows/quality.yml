name: Quality Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Check dependency manifests
        run: python scripts/check_dependency_manifests.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Lint canonical infrastructure
        run: |
          ruff check --select E9,F63,F7,F82 src/memoria_audiovisual/digital_infrastructure
          ruff check \
            src/memoria_audiovisual/digital_infrastructure/adapters.py \
            src/memoria_audiovisual/digital_infrastructure/ingestion.py \
            src/memoria_audiovisual/digital_infrastructure/ingestion_batches.py \
            src/memoria_audiovisual/digital_infrastructure/raw_artifacts.py \
            tests/test_digital_infrastructure_ingestion.py \
            tests/test_digital_infrastructure_ingestion_artifacts.py

      - name: Check formatting for Wave 2A scope
        run: |
          ruff format --check \
            src/memoria_audiovisual/digital_infrastructure/adapters.py \
            src/memoria_audiovisual/digital_infrastructure/ingestion.py \
            src/memoria_audiovisual/digital_infrastructure/ingestion_batches.py \
            src/memoria_audiovisual/digital_infrastructure/raw_artifacts.py \
            tests/test_digital_infrastructure_ingestion.py \
            tests/test_digital_infrastructure_ingestion_artifacts.py

      - name: Type-check Wave 2A scope
        run: |
          mypy --follow-imports=skip \
            src/memoria_audiovisual/digital_infrastructure/adapters.py \
            src/memoria_audiovisual/digital_infrastructure/ingestion.py \
            src/memoria_audiovisual/digital_infrastructure/ingestion_batches.py \
            src/memoria_audiovisual/digital_infrastructure/raw_artifacts.py

      - name: Enforce Wave 2A coverage floor
        run: |
          coverage erase
          coverage run --branch -m pytest -q \
            tests/test_digital_infrastructure_ingestion.py \
            tests/test_digital_infrastructure_ingestion_artifacts.py
          coverage report \
            --include="*/digital_infrastructure/adapters.py,*/digital_infrastructure/ingestion.py,*/digital_infrastructure/ingestion_batches.py,*/digital_infrastructure/raw_artifacts.py" \
            --show-missing

      - name: Compile Python modules
        run: |
          python -m py_compile app/streamlit_app.py
          python -m py_compile src/memoria_audiovisual/aamod.py
          python -m py_compile src/memoria_audiovisual/aamod_exports.py
          python -m py_compile src/memoria_audiovisual/anf.py
          python -m py_compile src/memoria_audiovisual/anf_exports.py
          python -m py_compile src/memoria_audiovisual/adlibitum_protocol.py
          python -m py_compile src/memoria_audiovisual/analysis.py
          python -m py_compile src/memoria_audiovisual/ape_exports.py
          python -m py_compile src/memoria_audiovisual/archipop.py
          python -m py_compile src/memoria_audiovisual/archipop_exports.py
          python -m py_compile src/memoria_audiovisual/dashboard_data.py
          python -m py_compile src/memoria_audiovisual/discovery.py
          python -m py_compile src/memoria_audiovisual/european_aggregators.py
          python -m py_compile src/memoria_audiovisual/europe_closure.py
          python -m py_compile src/memoria_audiovisual/european_protocols.py
          python -m py_compile src/memoria_audiovisual/euscreen.py
          python -m py_compile src/memoria_audiovisual/euscreen_exports.py
          python -m py_compile src/memoria_audiovisual/output_files.py
          python -m py_compile src/memoria_audiovisual/organism.py
          python -m py_compile src/memoria_audiovisual/pares.py
          python -m py_compile src/memoria_audiovisual/pares_exports.py
          python -m py_compile src/memoria_audiovisual/pipeline.py
          python -m py_compile src/memoria_audiovisual/snapshot_metadata.py
          python -m py_compile src/memoria_audiovisual/sfa.py
          python -m py_compile src/memoria_audiovisual/sfa_exports.py
          python -m py_compile src/memoria_audiovisual/timeline.py
          python -m compileall -q src/memoria_audiovisual/digital_infrastructure
          python -m py_compile src/memoria_audiovisual/statetech/digital_infrastructure_adapter.py
          python -m py_compile src/memoria_audiovisual/statetech/digital_infrastructure_review.py
          python -m py_compile scripts/audit_digital_infrastructure.py
          python -m py_compile scripts/build_ape_analytics.py
          python -m py_compile scripts/build_euscreen_analytics.py
          python -m py_compile scripts/build_ina_analytics.py
          python -m py_compile scripts/build_pares_analytics.py
          python -m py_compile scripts/build_europe_closure_report.py
          python -m py_compile scripts/check_aamod_outputs.py
          python -m py_compile scripts/check_archipop_outputs.py
          python -m py_compile scripts/check_ape_outputs.py
          python -m py_compile scripts/check_euscreen_outputs.py
          python -m py_compile scripts/check_ina_outputs.py
          python -m py_compile scripts/check_dependency_manifests.py
          python -m py_compile scripts/check_deployment_ready.py
          python -m py_compile scripts/check_observatory_cycle.py
          python -m py_compile scripts/check_pares_outputs.py
          python -m py_compile scripts/evaluate_european_aggregators.py
          python -m py_compile scripts/prototype_archiveshub_protocol.py
          python -m py_compile scripts/prototype_francearchives_protocol.py
          python -m py_compile scripts/run_euscreen_pipeline.py
          python -m py_compile scripts/run_aamod_pipeline.py
          python -m py_compile scripts/run_anf_pipeline.py
          python -m py_compile scripts/run_adlibitum_protocol.py
          python -m py_compile scripts/run_archipop_pipeline.py
          python -m py_compile scripts/run_ina_pipeline.py
          python -m py_compile scripts/run_observatory_cycle.py
          python -m py_compile scripts/run_pares_pipeline.py
          python -m py_compile scripts/run_sfa_pipeline.py
          python -m py_compile scripts/check_anf_outputs.py
          python -m py_compile scripts/check_sfa_outputs.py

      - name: Validate Gosfilmofond technical probe contract
        run: |
          ruff check --select E9,F63,F7,F82 \
            src/memoria_audiovisual/gosfilmofond_probe.py \
            scripts/probe_gosfilmofond_catalog.py \
            tests/test_gosfilmofond_probe.py
          python -m unittest discover -s tests -p 'test_gosfilmofond_probe.py' -v

      - name: Probe Gosfilmofond public catalogue
        if: github.event_name == 'pull_request' && github.head_ref == 'corpus/gosfilmofond-probe-v1'
        run: python scripts/probe_gosfilmofond_catalog.py

      - name: Upload Gosfilmofond probe artifact
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'corpus/gosfilmofond-probe-v1'
        uses: actions/upload-artifact@v4
        with:
          name: gosfilmofond-catalog-probe
          path: data/output/gosfilmofond_catalog_probe.json
          if-no-files-found: error

      - name: Validate IFI Archive Player technical probe contract
        run: |
          ruff check --select E9,F63,F7,F82 \
            src/memoria_audiovisual/ifi_archive_player_probe.py \
            scripts/probe_ifi_archive_player.py \
            tests/test_ifi_archive_player_probe.py
          python -m unittest discover -s tests -p 'test_ifi_archive_player_probe.py' -v

      - name: Probe IFI Archive Player public discovery surfaces
        if: github.event_name == 'pull_request' && github.head_ref == 'corpus/ifi-irish-film-archive-probe-v1'
        run: python scripts/probe_ifi_archive_player.py

      - name: Upload IFI Archive Player probe artifact
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'corpus/ifi-irish-film-archive-probe-v1'
        uses: actions/upload-artifact@v4
        with:
          name: ifi-archive-player-probe
          path: data/output/ifi_archive_player_probe.json
          if-no-files-found: error

      - name: Validate IFI Archive Player staged collector
        run: |
          ruff check --select E9,F63,F7,F82 \
            src/memoria_audiovisual/ifi_archive_player.py \
            src/memoria_audiovisual/ifi_archive_player_exports.py \
            scripts/run_ifi_archive_player_pipeline.py \
            scripts/check_ifi_archive_player_outputs.py \
            tests/test_ifi_archive_player_collection.py
          python -m unittest discover -s tests -p 'test_ifi_archive_player_collection.py' -v

      - name: Validate IFI Archive Player canonical baseline
        run: python scripts/check_ifi_archive_player_outputs.py

      - name: Run IFI Archive Player staged baseline
        if: github.event_name == 'pull_request' && github.head_ref == 'corpus/ifi-irish-film-archive-v1'
        run: python scripts/run_ifi_archive_player_pipeline.py

      - name: Upload IFI Archive Player staged baseline
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'corpus/ifi-irish-film-archive-v1'
        uses: actions/upload-artifact@v4
        with:
          name: ifi-archive-player-staged-baseline
          path: data/output/ifi_archive_player_*
          if-no-files-found: error

      - name: Validate IFI Archive Player staged baseline
        if: github.event_name == 'pull_request' && github.head_ref == 'corpus/ifi-irish-film-archive-v1'
        run: python scripts/check_ifi_archive_player_outputs.py

      - name: Regenerate IFI promotion queue outputs
        if: github.event_name == 'pull_request' && github.head_ref == 'corpus/ifi-irish-film-archive-v1'
        run: |
          python - <<'PY'
          from memoria_audiovisual.config import OUTPUT_DIR
          from memoria_audiovisual.europe_research import write_europe_research_outputs
          from memoria_audiovisual.inclusion_queue import write_next_inclusion_candidates

          write_europe_research_outputs(OUTPUT_DIR)
          write_next_inclusion_candidates(output_dir=OUTPUT_DIR, limit=3)
          PY

      - name: Upload IFI promotion queue outputs
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'corpus/ifi-irish-film-archive-v1'
        uses: actions/upload-artifact@v4
        with:
          name: ifi-promotion-queue
          path: |
            data/output/observatorio_pesquisa_europa.csv
            data/output/observatorio_fila_pesquisa_europa.csv
            data/output/observatorio_resumo_pesquisa_europa.csv
            data/output/observatorio_proximos_candidatos_inclusao.json
          if-no-files-found: error

      - name: Validate Image'Est technical probe contract
        run: |
          ruff check --select E9,F63,F7,F82 \
            src/memoria_audiovisual/image_est_probe.py \
            scripts/probe_image_est.py \
            tests/test_image_est_probe.py
          python -m unittest discover -s tests -p 'test_image_est_probe.py' -v

      - name: Probe Image'Est public film catalogue
        if: github.event_name == 'pull_request' && github.head_ref == 'corpus/image-est-probe-v1'
        run: python scripts/probe_image_est.py

      - name: Upload Image'Est probe artifact
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'corpus/image-est-probe-v1'
        uses: actions/upload-artifact@v4
        with:
          name: image-est-probe
          path: data/output/image_est_probe.json
          if-no-files-found: error

      - name: Validate Croatian Cinematheque technical probe contract
        run: |
          ruff check --select E9,F63,F7,F82 \
            src/memoria_audiovisual/croatian_cinematheque_probe.py \
            scripts/probe_croatian_cinematheque.py \
            tests/test_croatian_cinematheque_probe.py
          python -m unittest discover -s tests -p 'test_croatian_cinematheque_probe.py' -v

      - name: Probe Croatian Cinematheque public discovery surfaces
        if: github.event_name == 'pull_request' && github.head_ref == 'corpus/croatian-cinematheque-probe-v1'
        run: python scripts/probe_croatian_cinematheque.py

      - name: Upload Croatian Cinematheque probe artifact
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'corpus/croatian-cinematheque-probe-v1'
        uses: actions/upload-artifact@v4
        with:
          name: croatian-cinematheque-probe
          path: data/output/croatian_cinematheque_probe.json
          if-no-files-found: error

      - name: Validate Murnau-Stiftung staged corpus contract
        run: |
          ruff check --select E9,F63,F7,F82 \
            src/memoria_audiovisual/murnau_stiftung.py \
            src/memoria_audiovisual/murnau_stiftung_exports.py \
            scripts/run_murnau_stiftung_pipeline.py \
            scripts/check_murnau_stiftung_outputs.py \
            tests/test_murnau_stiftung_collection.py
          python -m unittest discover -s tests -p 'test_murnau_stiftung_collection.py' -v

      - name: Probe Murnau-Stiftung live catalogue before corpus admission
        if: github.event_name == 'pull_request' && github.head_ref == 'corpus/murnau-stiftung-v1'
        run: python scripts/run_murnau_stiftung_pipeline.py

      - name: Upload Murnau-Stiftung probe artifact
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'corpus/murnau-stiftung-v1'
        uses: actions/upload-artifact@v4
        with:
          name: murnau-stiftung-probe
          path: data/output/murnau_stiftung_*
          if-no-files-found: error

      - name: Validate Murnau-Stiftung live probe
        if: github.event_name == 'pull_request' && github.head_ref == 'corpus/murnau-stiftung-v1'
        run: python scripts/check_murnau_stiftung_outputs.py

      - name: Validate Forum des images corpus contract
        run: |
          ruff check --select E9,F63,F7,F82 \
            src/memoria_audiovisual/forum_des_images.py \
            src/memoria_audiovisual/forum_des_images_exports.py \
            scripts/run_forum_des_images_pipeline.py \
            scripts/check_forum_des_images_outputs.py \
            tests/test_forum_des_images_collection.py
          python -m unittest discover -s tests -p 'test_forum_des_images_collection.py' -v

      - name: Validate Gosfilmofond staged collector
        run: |
          ruff check --select E9,F63,F7,F82 \
            src/memoria_audiovisual/gosfilmofond.py \
            src/memoria_audiovisual/gosfilmofond_exports.py \
            scripts/run_gosfilmofond_pipeline.py \
            scripts/check_gosfilmofond_outputs.py \
            tests/test_gosfilmofond_collection.py
          python -m unittest discover -s tests -p 'test_gosfilmofond_collection.py' -v

      - name: Validate Gosfilmofond canonical baseline
        run: python scripts/check_gosfilmofond_outputs.py

      - name: Validate production analysis admission and corpus inclusion queue
        run: |
          ruff check --select E9,F63,F7,F82 \
            src/memoria_audiovisual/analysis_instruments.py \
            src/memoria_audiovisual/inclusion_queue.py \
            scripts/run_approved_analysis.py \
            scripts/next_inclusion_candidate.py \
            tests/test_analysis_instruments.py \
            tests/test_inclusion_queue.py
          python -m unittest discover -s tests -p 'test_analysis_instruments.py' -v
          python -m unittest discover -s tests -p 'test_inclusion_queue.py' -v
          python scripts/run_approved_analysis.py --list > /tmp/mar-approved-analysis.json

      - name: Check MAR scientific methodology document contract
        run: |
          ruff check --select E9,F63,F7,F82 \
            tests/test_observatory_methodology.py \
            tests/test_m3_corpus_relation_audit.py \
            tests/test_val009_claim_amendment.py
          python -m unittest discover -s tests -p 'test_observatory_methodology.py' -v
          python -m unittest discover -s tests -p 'test_m3_corpus_relation_audit.py' -v
          python -m unittest discover -s tests -p 'test_val009_claim_amendment.py' -v

      - name: Validate VAL-009 technical preflight
        run: |
          ruff check --select E9,F63,F7,F82 \
            src/memoria_audiovisual/digital_infrastructure/val009_preflight.py \
            tests/test_val009_preflight.py
          python -m unittest discover -s tests -p 'test_val009_preflight.py' -v

      - name: Validate VAL-009 collector provenance
        run: |
          ruff check --select E9,F63,F7,F82 \
            src/memoria_audiovisual/digital_infrastructure/val009_capture_provenance.py \
            tests/test_val009_capture_provenance.py
          python -m unittest discover -s tests -p 'test_val009_capture_provenance.py' -v

      - name: Validate VAL-009 v23 origin capture
        run: |
          ruff check --select E9,F63,F7,F82 \
            src/memoria_audiovisual/digital_infrastructure/val009_origin_bridge.py \
            tests/test_val009_origin_bridge.py
          python -m unittest discover -s tests -p 'test_val009_origin_bridge.py' -v

      - name: Validate VAL-009 methodology review structure (HOLD only)
        run: |
          ruff check --select E9,F63,F7,F82 \
            scripts/review_val009_methodology.py tests/test_val009_methodology_review.py
          python -m unittest discover -s tests -p 'test_val009_methodology_review.py' -v
          python scripts/review_val009_methodology.py --structure-only

      - name: Validate VAL-009 exposure inventory against pinned historical checkout
        run: |
          python scripts/audit_val009_exposure.py --structure-only
          ruff check --select E9,F63,F7,F82 \
            scripts/audit_val009_exposure.py tests/test_val009_exposure_inventory.py
          python -m unittest discover -s tests -p 'test_val009_exposure_inventory.py' -v
          git fetch --no-tags --depth=1 origin 4544bbc40e076cd7a81800a3c93ebbfb8efae5b2
          git worktree add --detach ../mar-val009-historical 4544bbc40e076cd7a81800a3c93ebbfb8efae5b2
          python scripts/audit_val009_exposure.py --historical-root ../mar-val009-historical \
            --write-preview ./val009_exclusion_preview_UNSEALED.json
          python scripts/review_val009_methodology.py --historical-root ../mar-val009-historical
          git worktree remove ../mar-val009-historical

      - name: Run unittest suite
        run: python -m unittest discover -s tests -v

      - name: Validate Onda 2A ingestion contracts
        run: python -m pytest -q tests/test_digital_infrastructure_ingestion.py tests/test_digital_infrastructure_ingestion_artifacts.py

      - name: Validate Porta 2 contract
        run: python -m pytest -q tests/test_digital_infrastructure_audit.py tests/test_digital_infrastructure_phase2.py

      - name: Check deployment snapshot
        run: python scripts/check_deployment_ready.py
