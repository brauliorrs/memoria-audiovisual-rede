name: Quality Checks

on:
  pull_request:
  push:
    branches:
      - main
      - presentation/rpv-1

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . pytest

      - name: Compile Python sources
        run: python -m compileall -q app src scripts

      - name: Run tests
        run: python -m pytest -q

      - name: Check deployment snapshot
        run: python scripts/check_deployment_ready.py
