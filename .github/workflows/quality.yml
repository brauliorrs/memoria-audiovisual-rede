name: Quality Checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - presentation/rpv-1

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Apply definitive refresh-table refactor
        if: github.ref == 'refs/heads/presentation/rpv-1' && github.actor != 'github-actions[bot]'
        run: python scripts/apply_refresh_table_i18n_refactor.py

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . pytest

      - name: Compile Python sources
        run: python -m compileall -q app src scripts

      - name: Run tests
        run: python -m pytest -q

      - name: Validate reference corpus manifest
        run: python scripts/audit_reference_corpus_manifest.py

      - name: Validate derived reference corpus inventory
        run: python scripts/build_reference_corpus_inventory.py --check

      - name: Validate scientific snapshot
        run: python scripts/audit_scientific_snapshot.py

      - name: Validate scientific indicator results
        run: python scripts/audit_indicator_results.py

      - name: Audit methodology consistency
        run: python scripts/audit_methodology_consistency.py

      - name: Audit scientific integrity
        run: python scripts/audit_scientific_integrity.py

      - name: Check deployment snapshot
        run: python scripts/check_deployment_ready.py

      - name: Commit definitive refresh-table refactor
        if: github.ref == 'refs/heads/presentation/rpv-1' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/streamlit_app.py src/memoria_audiovisual/ui/refresh_table.py src/memoria_audiovisual/locale_catalog.py tests/test_refresh_table_locale_compatibility.py
          git commit -m "fix: refatorar tabela de atualização com nomes internos" || exit 0
          git push origin HEAD:presentation/rpv-1
