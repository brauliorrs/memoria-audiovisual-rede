name: Apply category unit navigation

on:
  push:
    branches:
      - presentation/rpv-1
    paths:
      - scripts/apply_category_unit_navigation.py
      - src/memoria_audiovisual/ui/navigation.py
      - .github/workflows/apply-category-unit-navigation.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: presentation/rpv-1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Apply migration
        run: python scripts/apply_category_unit_navigation.py

      - name: Commit migration result
        run: |
          if git diff --quiet; then
            echo "No migration changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/streamlit_app.py
          git commit -m "Move unit navigation inside category tabs"
          git push origin HEAD:presentation/rpv-1
