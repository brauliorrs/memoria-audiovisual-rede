name: Sync Portuguese catalogue once

on:
  push:
    branches:
      - presentation/rpv-1
    paths:
      - .github/workflows/sync-portuguese-catalog-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: presentation/rpv-1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync Portuguese catalogue
        run: python scripts/sync_portuguese_catalog.py
      - name: Verify catalogue
        run: python scripts/sync_portuguese_catalog.py --check
      - name: Commit synchronized catalogue
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/memoria_audiovisual/locales/pt.json
          git commit -m "Sync Portuguese interface catalogue"
          git push
