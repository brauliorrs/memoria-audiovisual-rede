name: MAR Title Cloud — atomic review only (B2 HOLD)

# Standalone bot publication is suspended. A scientific corpus update MUST
# regenerate all affected site projections in a single reviewed bundle.
# No automatic isolated cloud PR, no Git write token and no deployment.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Reject a standalone word-cloud publication
        run: |
          python3 scripts/check_mar_scientific_snapshot_lock.py
          python3 scripts/build_mar_site_projections_b2.py --check
          python3 scripts/build_mar_title_wordcloud.py --check
          echo "B2 review-only: no standalone PR, no automated publication."
