name: MAR Auto-refresh Title Word Cloud

# Source additions/updates arrive through the same versioned scientific catalogue
# pipeline as Streamlit. Generated statistics, never item-level fichas, are proposed
# for publication by a bot PR. Protected main is never written directly by this job.
on:
  push:
    branches: [main]
    paths:
      - "data/output/*_catalogo_videos_analitico.csv"
      - "site/data/kavi-public.json"
      - "scripts/build_mar_title_wordcloud.py"
      - "tests/test_mar_title_wordcloud.py"
      - ".github/workflows/mar-wordcloud-refresh.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: mar-title-wordcloud-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'brauliorrs/memoria-audiovisual-rede'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout versioned source snapshots
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Recompute deterministic title-frequency statistics
        run: python3 scripts/build_mar_title_wordcloud.py
      - name: Verify incremental corpus/title update contract
        run: |
          python3 -m unittest discover -s tests -p "test_mar_wordcloud_growth.py" -v
          python3 -m unittest discover -s tests -p "test_mar_title_wordcloud.py" -v
          python3 scripts/build_mar_title_wordcloud.py --check
      - name: Detect frequency changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- site/data/title-wordcloud.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Title cloud is already current; no PR or deployment needed."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Observed new or modified title terms. Preparing one aggregate-only PR."
          fi
      - name: Update a single bot PR (never push directly to main)
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="automation/mar-title-wordcloud"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Fetch the existing bot branch to make --force-with-lease safe.
          git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" || true
          git checkout -B "$BRANCH" "$GITHUB_SHA"
          git add -- site/data/title-wordcloud.json
          if test "$(git diff --cached --name-only)" != "site/data/title-wordcloud.json"; then
            echo "::error::Unexpected generated files: refusing bot publication"
            exit 1
          fi
          git commit -m "data(mar): refresh title-wordcloud counts after corpus ingestion"
          git push --force-with-lease origin "HEAD:refs/heads/$BRANCH"

          PR="$(gh pr list --state open --head "$BRANCH" --json number --jq '.[0].number // empty')"
          if test -z "$PR"; then
            gh pr create --base main --head "$BRANCH" \
              --title "data(MAR): atualizar nuvem após incorporação de títulos" \
              --body "Atualização automática dos termos estatísticos agregados da nuvem, acionada por catálogos do MAR. Apenas site/data/title-wordcloud.json foi modificado. Nenhum título, ID, URL de mídia ou ficha é republicado. A publicação ocorre pelo PR, após CI, no projeto Vercel existente."
            PR="$(gh pr list --state open --head "$BRANCH" --json number --jq '.[0].number // empty')"
          fi
          test -n "$PR" || { echo "::error::Bot PR was not created"; exit 1; }
          echo "Aggregate-only PR #$PR updated."

          # GitHub prevents PR-triggered CI events created with GITHUB_TOKEN.
          # Explicit workflow_dispatch attaches the required checks to the bot SHA.
          gh workflow run mar-title-wordcloud.yml --ref "$BRANCH"
          gh workflow run mar-site.yml --ref "$BRANCH"
          gh workflow run quality.yml --ref "$BRANCH"

          # Only the reviewed single-file PR can auto-merge, if the repository
          # explicitly allows it. Otherwise leave it open; no publication happens.
          if gh pr merge "$PR" --auto --merge; then
            echo "Auto-merge requested; GitHub required checks remain authoritative."
          else
            echo "::warning::Auto-merge unavailable. Aggregate update is preserved in PR #$PR for review."
          fi
