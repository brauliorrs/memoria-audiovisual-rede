name: Migrate Overview Semantic Catalogue

on:
  push:
    paths:
      - '.github/workflows/migrate-overview-semantic-catalogue.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: presentation/rpv-1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Migrate first Overview layer
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          app_path = Path('app/streamlit_app.py')
          locale_path = Path('src/memoria_audiovisual/locales/pt.json')
          text = app_path.read_text(encoding='utf-8')

          replacements = {
              '    st.markdown(tr("overview_title"))': '    st.markdown(tr_key("overview.title"))',
              '    st.caption(tr("overview_caption"))': '    st.caption(tr_key("overview.caption"))',
              '''    st.info(\n        f"{OBSERVATORY_PROFILE['description']} "\n        f"{OBSERVATORY_PROFILE['expansion_strategy']} "\n        f"{OBSERVATORY_PROFILE['audiovisual_rule']}"\n        if APP_LANGUAGE == DEFAULT_LANGUAGE\n        else tr("observatory_profile_summary")\n    )''': '    st.info(tr_key("overview.profile_summary"))',
              '    st.markdown(tr("academic_axis_title"))': '    st.markdown(tr_key("overview.academic_axis.title"))',
              '    st.markdown(tr("academic_axis_text"))': '    st.markdown(tr_key("overview.academic_axis.text"))',
              '    st.caption(tr("academic_axis_caption"))': '    st.caption(tr_key("overview.academic_axis.caption"))',
              '        st.markdown("### Acompanhamento das atualizações")': '        st.markdown(tr_key("overview.refresh.title"))',
              '''        st.caption(\n            "Este quadro acompanha a saúde temporal do observatório por unidade documental, distinguindo "\n            "atualizações recentes, pendências de rodadas parciais e atrasos de acompanhamento."\n        )''': '        st.caption(tr_key("overview.refresh.caption"))',
              '        refresh_metric_cols[0].metric("Atualizadas na última rodada", latest_cycle_updates)': '        refresh_metric_cols[0].metric(tr_key("overview.refresh.metrics.updated"), latest_cycle_updates)',
              '        refresh_metric_cols[1].metric("Pendentes na rodada parcial", partial_pending)': '        refresh_metric_cols[1].metric(tr_key("overview.refresh.metrics.partial_pending"), partial_pending)',
              '        refresh_metric_cols[2].metric("Atualizações atrasadas", stale_count)': '        refresh_metric_cols[2].metric(tr_key("overview.refresh.metrics.stale"), stale_count)',
              '        refresh_metric_cols[3].metric("Pendências na última rodada", failure_count)': '        refresh_metric_cols[3].metric(tr_key("overview.refresh.metrics.failed"), failure_count)',
              '        with st.expander("Ver distribuição dos estados de atualização", expanded=False):': '        with st.expander(tr_key("overview.refresh.states_expander"), expanded=False):',
              '        st.markdown("### Índice de dados públicos")': '        st.markdown(tr_key("overview.public_access.title"))',
              '''        st.caption(\n            "O índice compara registros audiovisuais disponíveis em superfície pública com registros "\n            "cujo acesso ao audiovisual exige pagamento, autenticação, cadastro ou licenciamento. "\n            "Bancos privados/publicitários de imagens não entram no índice; permanecem documentados "\n            "apenas na auditoria metodológica de acesso pago/restrito."\n        )''': '        st.caption(tr_key("overview.public_access.caption"))',
              '    st.markdown("### Linha do tempo e retração pública do audiovisual")': '    st.markdown(tr_key("overview.timeline.title"))',
              '''    st.caption(\n        "Esta camada reúne a memória histórica das unidades documentais e prepara o observatório para detectar "\n        "ausências, indisponibilidades recorrentes e perda de evidência pública detectável de audiovisual."\n    )''': '    st.caption(tr_key("overview.timeline.caption"))',
              '    st.markdown("### Categorias analíticas do observatório")': '    st.markdown(tr_key("overview.categories.title"))',
              '''    st.caption(\n        "As categorias abaixo delimitam níveis diferentes de observação. Elas são comparáveis, "\n        "mas não são tratadas como equivalentes do ponto de vista metodológico."\n    )''': '    st.caption(tr_key("overview.categories.caption"))',
              '    st.markdown("### Estratégia de expansão")': '    st.markdown(tr_key("overview.expansion.title"))',
              '''    st.caption(\n        "O organismo cresce primeiro por agregadores continentais e, depois, incorpora "\n        "arquivos e instituições não cobertos por esses agregadores."\n    )''': '    st.caption(tr_key("overview.expansion.caption"))',
              '    st.markdown("### Fila de expansão do observatório")': '    st.markdown(tr_key("overview.queue.title"))',
              '''    st.caption(\n        "A fila abaixo é gerada por regra pública e reprodutível. Neste momento, ela prioriza "\n        "o fechamento da Europa antes da abertura sistemática de novos continentes."\n    )''': '    st.caption(tr_key("overview.queue.caption"))',
          }

          missing = [old for old in replacements if old not in text]
          if missing:
              raise SystemExit(f'Replacements not found: {len(missing)}')
          for old, new in replacements.items():
              text = text.replace(old, new, 1)
          app_path.write_text(text, encoding='utf-8')

          catalogue = json.loads(locale_path.read_text(encoding='utf-8'))
          catalogue.update({
              'overview.title': '## Visão geral do observatório',
              'overview.caption': 'Síntese científica, metodológica e operacional da plataforma Memória Audiovisual em Rede.',
              'overview.profile_summary': 'Observatório digital aberto e comparativo dedicado à visibilidade pública, ao acesso, à circulação e à estabilidade de acervos audiovisuais em ambientes digitais. A expansão ocorre de forma controlada, preservando a distinção entre agregadores, arquivos especializados e instituições custodiais. A ausência de evidência pública detectável não é tratada como prova de inexistência de acervo.',
              'overview.academic_axis.title': '### Eixo científico e acadêmico',
              'overview.academic_axis.text': 'A plataforma articula observação pública, curadoria metodológica, comparação entre unidades documentais e acompanhamento longitudinal das condições de visibilidade e acesso ao audiovisual.',
              'overview.academic_axis.caption': 'Os indicadores devem ser interpretados como evidências públicas observáveis, e não como descrição exaustiva dos acervos institucionais.',
              'overview.refresh.title': '### Acompanhamento das atualizações',
              'overview.refresh.caption': 'Este quadro acompanha a saúde temporal do observatório por unidade documental, distinguindo atualizações recentes, pendências de rodadas parciais e atrasos de acompanhamento.',
              'overview.refresh.metrics.updated': 'Atualizadas na última rodada',
              'overview.refresh.metrics.partial_pending': 'Pendentes na rodada parcial',
              'overview.refresh.metrics.stale': 'Atualizações atrasadas',
              'overview.refresh.metrics.failed': 'Pendências na última rodada',
              'overview.refresh.states_expander': 'Ver distribuição dos estados de atualização',
              'overview.public_access.title': '### Índice de dados públicos',
              'overview.public_access.caption': 'O índice compara registros audiovisuais disponíveis em superfície pública com registros cujo acesso ao audiovisual exige pagamento, autenticação, cadastro ou licenciamento. Bancos privados ou publicitários de imagens não entram no índice e permanecem documentados apenas na auditoria metodológica de acesso pago ou restrito.',
              'overview.timeline.title': '### Linha do tempo e retração pública do audiovisual',
              'overview.timeline.caption': 'Esta camada reúne a memória histórica das unidades documentais e prepara o observatório para detectar ausências, indisponibilidades recorrentes e perda de evidência pública detectável de audiovisual.',
              'overview.categories.title': '### Categorias analíticas do observatório',
              'overview.categories.caption': 'As categorias abaixo delimitam níveis diferentes de observação. Elas são comparáveis, mas não são tratadas como equivalentes do ponto de vista metodológico.',
              'overview.expansion.title': '### Estratégia de expansão',
              'overview.expansion.caption': 'O organismo cresce primeiro por agregadores continentais e, depois, incorpora arquivos e instituições não cobertos por esses agregadores.',
              'overview.queue.title': '### Fila de expansão do observatório',
              'overview.queue.caption': 'A fila abaixo é gerada por regra pública e reprodutível. Neste momento, ela prioriza o fechamento da Europa antes da abertura sistemática de novos continentes.'
          })
          locale_path.write_text(json.dumps(catalogue, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Validate syntax and catalogue
        run: |
          python -m py_compile app/streamlit_app.py src/memoria_audiovisual/locale_catalog.py
          python - <<'PY'
          import json
          from pathlib import Path
          catalogue = json.loads(Path('src/memoria_audiovisual/locales/pt.json').read_text(encoding='utf-8'))
          required = [
            'overview.title', 'overview.caption', 'overview.profile_summary',
            'overview.academic_axis.title', 'overview.refresh.title',
            'overview.public_access.title', 'overview.timeline.title',
            'overview.categories.title', 'overview.expansion.title', 'overview.queue.title'
          ]
          missing = [key for key in required if key not in catalogue]
          if missing:
              raise SystemExit(f'Missing keys: {missing}')
          PY
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/streamlit_app.py src/memoria_audiovisual/locales/pt.json
          git commit -m 'refactor(i18n): migrate Overview first layer to semantic catalogue [skip ci]'
          git push origin HEAD:presentation/rpv-1
