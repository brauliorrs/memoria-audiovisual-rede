name: Revisão periódica Estado-tecnologia

on:
  workflow_dispatch:
    inputs:
      snapshot_id:
        description: "Identificador opcional do snapshot; vazio gera automaticamente"
        required: false
        type: string
      corpus:
        description: "Códigos de corpora separados por espaço; vazio processa todos os ativos"
        required: false
        type: string
  schedule:
    - cron: "17 3 1 * *"

permissions:
  contents: write

concurrency:
  group: statetech-periodic-review
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  STATETECH_STATE_DIR: data/statetech
  STATETECH_HISTORY_BRANCH: statetech-history

jobs:
  review:
    name: Auditar corpora e preservar cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then
            python -m pip install .
          else
            python -m pip install pandas requests beautifulsoup4 jsonschema
          fi

      - name: Restaurar memória durável da branch histórica
        id: restore-history
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${STATETECH_STATE_DIR}"
          mkdir -p "${STATETECH_STATE_DIR}"

          if git ls-remote --exit-code --heads origin "${STATETECH_HISTORY_BRANCH}" >/dev/null 2>&1; then
            git fetch origin "${STATETECH_HISTORY_BRANCH}:${STATETECH_HISTORY_BRANCH}"
            git worktree add .statetech-history "${STATETECH_HISTORY_BRANCH}"
            if [ -d ".statetech-history/${STATETECH_STATE_DIR}" ]; then
              cp -a ".statetech-history/${STATETECH_STATE_DIR}/." "${STATETECH_STATE_DIR}/"
            fi
            echo "history_exists=true" >> "$GITHUB_OUTPUT"
          else
            git worktree add -b "${STATETECH_HISTORY_BRANCH}" .statetech-history HEAD
            echo "history_exists=false" >> "$GITHUB_OUTPUT"
          fi

          mkdir -p "${STATETECH_STATE_DIR}/coverage"
          echo "Memória restaurada da branch ${STATETECH_HISTORY_BRANCH}."

      - name: Gerar identificador do snapshot
        id: snapshot
        shell: bash
        env:
          REQUESTED_SNAPSHOT: ${{ inputs.snapshot_id }}
        run: |
          if [ -n "${REQUESTED_SNAPSHOT}" ]; then
            SNAPSHOT_ID="${REQUESTED_SNAPSHOT}"
          else
            SNAPSHOT_ID="snapshot_$(date -u +'%Y_%m_%dT%H%M%SZ')"
          fi
          echo "snapshot_id=${SNAPSHOT_ID}" >> "$GITHUB_OUTPUT"
          echo "Snapshot proposto: ${SNAPSHOT_ID}"

      - name: Preparar seleção de corpora
        id: corpus
        shell: bash
        env:
          REQUESTED_CORPUS: ${{ inputs.corpus }}
        run: |
          set -euo pipefail
          printf '%s' "${REQUESTED_CORPUS}" > .statetech-corpora-input
          if [ -n "${REQUESTED_CORPUS}" ]; then
            echo "has_selection=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_selection=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validar ciclo antes da coleta
        shell: bash
        env:
          SNAPSHOT_ID: ${{ steps.snapshot.outputs.snapshot_id }}
          HISTORY_EXISTS: ${{ steps.restore-history.outputs.history_exists }}
        run: |
          set -euo pipefail
          mapfile -t CORPORA_ARGS < <(xargs -n1 < .statetech-corpora-input)
          HISTORY_ARG=()
          if [ "${HISTORY_EXISTS}" = "true" ]; then
            HISTORY_ARG=(--history-exists)
          fi
          python scripts/preflight_statetech_periodic_review.py \
            --snapshot-id "${SNAPSHOT_ID}" \
            --state-dir "${STATETECH_STATE_DIR}" \
            --report "${STATETECH_STATE_DIR}/preflight/${SNAPSHOT_ID}.json" \
            "${HISTORY_ARG[@]}" \
            --corpus "${CORPORA_ARGS[@]}"

      - name: Executar revisão periódica
        shell: bash
        env:
          SNAPSHOT_ID: ${{ steps.snapshot.outputs.snapshot_id }}
        run: |
          set -euo pipefail
          mapfile -t CORPORA_ARGS < <(xargs -n1 < .statetech-corpora-input)
          COMMAND=(
            python scripts/audit_digital_infrastructure.py
            --mode ledger
            --snapshot-id "${SNAPSHOT_ID}"
            --result-output "data/statetech/coverage/${SNAPSHOT_ID}/execution_summary.json"
          )
          if [ "${#CORPORA_ARGS[@]}" -gt 0 ]; then
            COMMAND+=(--corpus "${CORPORA_ARGS[@]}")
          fi
          "${COMMAND[@]}"

      - name: Verificar produtos obrigatórios
        shell: bash
        run: |
          SNAPSHOT_DIR="data/statetech/coverage/${{ steps.snapshot.outputs.snapshot_id }}"
          test -s "${SNAPSHOT_DIR}/parameter_coverage.json"
          test -s "${SNAPSHOT_DIR}/execution_summary.json"
          test -s "data/statetech/coverage/snapshot_coverage_index.jsonl"
          test -s "data/statetech/ledger.jsonl"
          test -s "data/statetech/ingestion_batches.jsonl"
          test -s "data/statetech/preflight/${{ steps.snapshot.outputs.snapshot_id }}.json"

      - name: Consolidar memória na branch histórica
        if: success()
        shell: bash
        env:
          SNAPSHOT_ID: ${{ steps.snapshot.outputs.snapshot_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf ".statetech-history/${STATETECH_STATE_DIR}"
          mkdir -p ".statetech-history/${STATETECH_STATE_DIR}"
          cp -a "${STATETECH_STATE_DIR}/." ".statetech-history/${STATETECH_STATE_DIR}/"

          # Entradas brutas podem crescer rapidamente e terão armazenamento próprio.
          rm -rf ".statetech-history/${STATETECH_STATE_DIR}/raw_artifacts"

          cd .statetech-history
          git add "${STATETECH_STATE_DIR}"
          if git diff --cached --quiet; then
            echo "Nenhuma alteração histórica para consolidar."
          else
            git commit -m "data(statetech): preservar ${SNAPSHOT_ID}"
            git push origin "HEAD:${STATETECH_HISTORY_BRANCH}"
          fi

      - name: Publicar cópia operacional temporária
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: statetech-${{ steps.snapshot.outputs.snapshot_id }}
          path: |
            data/statetech/preflight/${{ steps.snapshot.outputs.snapshot_id }}.json
            data/statetech/coverage/${{ steps.snapshot.outputs.snapshot_id }}/
            data/statetech/coverage/snapshot_coverage_index.jsonl
            data/statetech/ingestion_batches.jsonl
          if-no-files-found: warn
          retention-days: 90
