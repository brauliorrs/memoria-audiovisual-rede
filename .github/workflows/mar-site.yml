name: MAR Next.js Site

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "site/**"
      - "tests/test_mar_site_public_pages.py"
      - "tests/test_mar_title_wordcloud.py"
      - "tests/test_mar_wordcloud_growth.py"
      - "tests/test_mar_site_public_access_observatory.py"
      - "tests/test_mar_scientific_site_migration.py"
      - "tests/test_mar_research_dimensions.py"
      - "tests/test_mar_cross_corpus_comparison.py"
      - "tests/test_mar_geographic_permalinks.py"
      - "tests/test_mar_scientific_i18n.py"
      - "scripts/check_mar_site_index.py"
      - "scripts/build_mar_title_wordcloud.py"
      - ".github/workflows/mar-site.yml"
      - "data/output/kavi_mar_metadata_links.csv"
      - "data/output/kavi_mar_metadata_links_manifest.json"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tests/test_mar_site_public_pages.py"
      - "tests/test_mar_title_wordcloud.py"
      - "scripts/check_mar_site_index.py"
      - "scripts/build_mar_title_wordcloud.py"
      - ".github/workflows/mar-site.yml"

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Verify approved publication index against source and SHA256
        working-directory: .
        run: python3 scripts/check_mar_site_index.py
      - name: Review generated multilingual title frequencies
        working-directory: .
        run: |
          # Bad/corrupt title source must fail; only a valid but stale aggregate may wait for the bot PR.
          python3 scripts/build_mar_title_wordcloud.py --stdout >/dev/null
          if python3 scripts/build_mar_title_wordcloud.py --check; then
            echo "Title statistics match the versioned source files."
          else
            echo "::warning::Title cloud is pending its automatic source-refresh PR; site remains on last validated aggregate."
          fi
      - name: Verify new corpus inclusion changes title frequencies
        working-directory: .
        run: python3 -m unittest discover -s tests -p "test_mar_wordcloud_growth.py" -v
      - name: Test homepage word-cloud integrity and publication boundary
        working-directory: .
        run: python3 -m unittest discover -s tests -p "test_mar_title_wordcloud.py" -v
      - name: Test permanent documentary routes and publication boundaries
        working-directory: .
        run: python3 -m unittest discover -s tests -p "test_mar_site_public_pages.py" -v
      - name: Test historical access index without record publication
        working-directory: .
        run: python3 -m unittest discover -s tests -p "test_mar_site_public_access_observatory.py" -v
      - name: Verify migrated scientific dashboard contracts
        working-directory: .
        run: python3 -m unittest discover -s tests -p 'test_mar_scientific_site_migration.py' -v
      - name: Validate Streamlit research dimension source files
        working-directory: .
        run: python3 -m unittest discover -s tests -p 'test_mar_research_dimensions.py' -v
      - name: Verify three-source comparative research stays aggregate-only
        working-directory: .
        run: python3 -m unittest discover -s tests -p "test_mar_cross_corpus_comparison.py" -v
      - name: Install pinned frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Test reproducible source selections and country map
        run: npm run test:permalink
      - name: Validate geographic sources and permalink scientific contracts
        working-directory: .
        run: python3 -m unittest discover -s tests -p "test_mar_geographic_permalinks.py" -v
      - name: Validate core scientific PT EN ES editorial copy parity
        run: npm run test:scientific-i18n
      - name: Confirm original evidence and public-record gates preserved
        working-directory: .
        run: python3 -m unittest discover -s tests -p "test_mar_scientific_i18n.py" -v
      - name: Typecheck
        run: npm run typecheck
      - name: Build static Next.js site
        run: npm run build
      - name: Verify expected static routes
        run: |
          test -f out/index.html
          test -f out/acervo/index.html
          test -f out/instituicoes/index.html
          test -f out/instituicoes/kavi/index.html
          test -f out/metodologia/index.html
          test -f out/indice-acesso/index.html
          test -f out/observatorio/index.html
          test -f out/casos/index.html
          test -f out/analises/index.html
          test -f out/comparar/index.html
          test -f out/territorios/index.html
          test -f out/pesquisa/eye/index.html
          test -f out/pesquisa/ape/index.html
          test -f out/pesquisa/europeana/index.html
          test -f out/observatorio/eye/index.html
          count_profiles="$(find out/observatorio -mindepth 2 -maxdepth 2 -type f -name index.html | wc -l | tr -d '[:space:]')"
          test "$count_profiles" = "63"
          test -f out/acervo/kavi/kavi.elonet_elokuva_112915/index.html
          count="$(find out/acervo/kavi -mindepth 2 -maxdepth 2 -type f -name index.html | wc -l | tr -d '[:space:]')"
          test "$count" = "200"
