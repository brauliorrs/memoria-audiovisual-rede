name: MAR F02 Drive encrypted backup and isolated restore
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
concurrency:
  group: mar-f02-drive-backup
  cancel-in-progress: false
jobs:
  export:
    if: >-
      github.repository == 'brauliorrs/memoria-audiovisual-rede' &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && vars.MAR_P0_GOOGLE_DRIVE_BACKUP_TEST_ENABLED == 'true') ||
       (github.event_name == 'schedule' && vars.MAR_P0_GOOGLE_DRIVE_BACKUP_ENABLED == 'true'))
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment: mar-p0-drive-export
    outputs:
      cipher_sha: ${{ steps.send.outputs.cipher_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install PostgreSQL 18 client and Google libraries
        run: |
          bash scripts/mar_p0_install_pg18_ci.sh client
          python -m pip install 'cryptography==50.0.2' 'google-api-python-client==2.187.0' 'google-auth==2.43.0' 'google-auth-httplib2==0.2.0'
      - name: Export encrypted MAR P0 and verify Drive readback
        id: send
        env:
          MAR_P0_READONLY_DATABASE_URL: ${{ secrets.MAR_P0_READONLY_DATABASE_URL }}
          MAR_P0_RESTORE_AES_KEY_HEX: ${{ secrets.MAR_P0_RESTORE_AES_KEY_HEX }}
          MAR_P0_GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.MAR_P0_GOOGLE_DRIVE_FOLDER_ID }}
          MAR_P0_DRIVE_OAUTH_CLIENT_ID: ${{ secrets.MAR_P0_DRIVE_OAUTH_CLIENT_ID }}
          MAR_P0_DRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.MAR_P0_DRIVE_OAUTH_CLIENT_SECRET }}
          MAR_P0_DRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.MAR_P0_DRIVE_OAUTH_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          install -d -m 0700 "$RUNNER_TEMP/mar-drive"
          python -m scripts.mar_p0_offsite_pg_restore backup --encrypted-file "$RUNNER_TEMP/mar-drive/backup.aesgcm" --execute > "$RUNNER_TEMP/export.json"
          CIPHER_SHA="$(python -c 'import json,os; r=json.load(open(os.environ["RUNNER_TEMP"]+"/export.json")); assert r["status"]=="encrypted_backup_exported"; print(r["encrypted_sha256"])')"
          python -m scripts.mar_p0_offsite_google_drive upload --encrypted-file "$RUNNER_TEMP/mar-drive/backup.aesgcm" --receipt-file "$RUNNER_TEMP/mar-drive/private-receipt.json" --expected-sha256 "$CIPHER_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --execute > "$RUNNER_TEMP/upload.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          home=Path(os.environ["RUNNER_TEMP"])
          export=json.loads((home/"export.json").read_text())
          sent=json.loads((home/"upload.json").read_text())
          assert sent["status"]=="drive_ciphertext_uploaded_and_readback_verified"
          assert sent["sha256"]==export["encrypted_sha256"]
          assert sent["worm_proven"] is False
          assert sent["production_gate"]=="HOLD"
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("cipher_sha="+sent["sha256"]+"\n")
          print("PASS: ciphertext stored and checked against SHA-256; WORM is not claimed.")
          PY
      - name: Purge sensitive temporary files
        if: always()
        run: rm -rf "$RUNNER_TEMP/mar-drive" "$RUNNER_TEMP/export.json" "$RUNNER_TEMP/upload.json"
  isolated-restore:
    needs: [export]
    if: needs.export.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment: mar-p0-drive-recovery
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install PostgreSQL 18 server and Google libraries
        run: |
          bash scripts/mar_p0_install_pg18_ci.sh server
          python -m pip install 'cryptography==50.0.2' 'google-api-python-client==2.187.0' 'google-auth==2.43.0' 'google-auth-httplib2==0.2.0'
      - name: Download from Drive and restore independently
        env:
          MAR_P0_RESTORE_AES_KEY_HEX: ${{ secrets.MAR_P0_RESTORE_AES_KEY_HEX }}
          MAR_P0_GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.MAR_P0_GOOGLE_DRIVE_FOLDER_ID }}
          MAR_P0_DRIVE_OAUTH_CLIENT_ID: ${{ secrets.MAR_P0_DRIVE_OAUTH_CLIENT_ID }}
          MAR_P0_DRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.MAR_P0_DRIVE_OAUTH_CLIENT_SECRET }}
          MAR_P0_DRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.MAR_P0_DRIVE_OAUTH_REFRESH_TOKEN }}
          EXPECTED_SHA: ${{ needs.export.outputs.cipher_sha }}
        run: |
          set -euo pipefail
          umask 077
          install -d -m 0700 "$RUNNER_TEMP/mar-restored"
          python -m scripts.mar_p0_offsite_google_drive download --encrypted-file "$RUNNER_TEMP/mar-restored/backup.aesgcm" --min-age-hours 0 --max-age-hours 3 --expected-sha256 "$EXPECTED_SHA" --execute > "$RUNNER_TEMP/download.json"
          RESTORE_PASSWORD="$(openssl rand -hex 24)"
          RESTORE_DB="mar_p0_restore_$GITHUB_RUN_ID"
          printf "CREATE ROLE mar_p0_restore LOGIN PASSWORD '%s';\n" "$RESTORE_PASSWORD" | sudo -u postgres psql -X -v ON_ERROR_STOP=1 postgres >/dev/null
          sudo -u postgres createdb --owner=mar_p0_restore "$RESTORE_DB"
          export MAR_P0_ISOLATED_RESTORE_DATABASE_URL="postgresql://mar_p0_restore:$RESTORE_PASSWORD@127.0.0.1/$RESTORE_DB"
          unset RESTORE_PASSWORD
          python -m scripts.mar_p0_offsite_pg_restore restore --encrypted-file "$RUNNER_TEMP/mar-restored/backup.aesgcm" --expected-sha256 "$EXPECTED_SHA" --execute > "$RUNNER_TEMP/restore.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          dl=json.loads((root/"download.json").read_text())
          rs=json.loads((root/"restore.json").read_text())
          assert dl["status"]=="drive_ciphertext_download_verified"
          assert rs["status"]=="offsite_restored_and_verified"
          assert rs["rows_and_schema_sha256_equal"] is True
          assert rs["encrypted_sha256"]==dl["sha256"]==os.environ["EXPECTED_SHA"]
          assert rs["production_gate"]=="HOLD"
          print("PASS: independent PostgreSQL restore from Drive ciphertext.")
          PY
      - name: Purge disposable recovered files
        if: always()
        run: rm -rf "$RUNNER_TEMP/mar-restored" "$RUNNER_TEMP/download.json" "$RUNNER_TEMP/restore.json"
