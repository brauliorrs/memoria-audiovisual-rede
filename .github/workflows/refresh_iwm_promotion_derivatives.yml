name: Refresh IWM promotion derivatives

on:
  push:
    branches:
      - corpus/iwm-film-archive-promote-v1

permissions:
  contents: write

env:
  PYTHONPATH: src

jobs:
  refresh-promotion-derivatives:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: corpus/iwm-film-archive-promote-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Rebuild IWM outputs with corrected analytics
        run: |
          python scripts/run_iwm_film_pipeline.py
          python scripts/check_iwm_film_outputs.py

      - name: Prove enumerated record baseline is unchanged
        run: |
          echo "0ae2508d387fe8954836a3ae114d4f84a82ccccdadabeef1a4d464f8fb044ffa  data/output/iwm_film_links_video.csv" | sha256sum -c -
          python - <<'PY'
          import pandas as pd
          df = pd.read_csv("data/output/iwm_film_links_video.csv", low_memory=False)
          assert len(df) == 40877
          assert df["video_link"].nunique() == 40877
          PY

      - name: Regenerate organism-wide promotion outputs
        run: |
          python - <<'PY'
          from memoria_audiovisual.config import OUTPUT_DIR
          from memoria_audiovisual.organism import write_active_corpora_registry
          from memoria_audiovisual.public_access_index import write_public_access_index
          from memoria_audiovisual.europe_research import write_europe_research_outputs
          from memoria_audiovisual.inclusion_queue import write_next_inclusion_candidates

          registry = write_active_corpora_registry(OUTPUT_DIR)
          assert len(registry) == 60
          assert (registry["code"] == "iwm_film").sum() == 1

          access = write_public_access_index(OUTPUT_DIR)
          iwm = access["by_corpus"].loc[
              access["by_corpus"]["corpus_code"] == "iwm_film"
          ]
          assert len(iwm) == 1
          assert int(iwm.iloc[0]["materialized_records_total"]) == 40877

          write_europe_research_outputs(OUTPUT_DIR)
          queue = write_next_inclusion_candidates(output_dir=OUTPUT_DIR, limit=3)
          assert [item["rank"] for item in queue["candidates"]] == [80, 81, 82]
          assert queue["candidates"][0]["unit_code"] == "inedits-jean-vigo-institute"
          PY

      - name: Validate review regressions
        run: |
          python -m unittest discover -s tests -p 'test_iwm_film_collection.py' -v
          python -m unittest discover -s tests -p 'test_organism.py' -v
          python -m unittest discover -s tests -p 'test_public_access_index.py' -v
          python -m unittest discover -s tests -p 'test_europe_research.py' -v
          python -m unittest discover -s tests -p 'test_inclusion_queue.py' -v
          python - <<'PY'
          import pandas as pd
          themes = pd.read_csv("data/output/iwm_film_resumo_temas.csv")
          totals = dict(zip(themes["tema"], themes["total"]))
          assert totals.get("Digitalização e acesso", 0) == 0
          assert totals.get("Registro filmográfico IWM — tema não identificado", 0) > 40000
          PY

      - name: Commit corrected derived outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/output/iwm_film_* \
            data/output/observatorio_corpora_ativos.csv \
            data/output/observatorio_indice_dados_publicos.csv \
            data/output/observatorio_indice_dados_publicos_por_corpus.csv \
            data/output/observatorio_unidades_acesso_restrito_indice.csv \
            data/output/observatorio_pesquisa_europa.csv \
            data/output/observatorio_fila_pesquisa_europa.csv \
            data/output/observatorio_resumo_pesquisa_europa.csv \
            data/output/observatorio_proximos_candidatos_inclusao.json
          git diff --cached --quiet && exit 0
          git commit -m "data(iwm): regenerate promotion analytics and global indexes"
          git push origin HEAD:corpus/iwm-film-archive-promote-v1
