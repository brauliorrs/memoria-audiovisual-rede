name: Update licensing backlog

on:
  push:
    branches:
      - presentation/rpv-1
    paths:
      - ".github/workflows/update-licensing-backlog.yml"

permissions:
  contents: write

jobs:
  update-backlog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: presentation/rpv-1
          fetch-depth: 0

      - name: Insert licensing queue
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/project/BACKLOG.md")
          text = path.read_text(encoding="utf-8")

          section = '''## P6A — licenciamento do código, da documentação e dos dados\n\n**Estado:** não implementado; colocado em fila como portão obrigatório antes da publicação pública definitiva.\n\nO repositório ainda não possui licença explícita reconhecida pelo GitHub. A visualização pública do código não concede, por si só, autorização clara para copiar, modificar ou redistribuir o software, a documentação ou os produtos derivados. A implantação deverá separar os diferentes objetos jurídicos do projeto, evitando aplicar uma licença única a materiais com regimes distintos.\n\n### Política proposta para validação e implantação\n\n- **código-fonte autoral:** Apache License 2.0, sujeita à confirmação institucional e de titularidade;\n- **documentação autoral e livro científico:** Creative Commons Attribution 4.0 International — CC BY 4.0;\n- **dados derivados produzidos pela plataforma:** CC BY 4.0, quando a proveniência e os direitos das fontes permitirem;\n- **metadados de terceiros:** permanecem sujeitos às licenças, termos de uso e limitações das instituições de origem;\n- **vídeos, imagens, áudios e demais conteúdos audiovisuais:** não são relicenciados pela plataforma;\n- **componentes e dependências de terceiros:** preservam suas próprias licenças e avisos.\n\nA política proposta deverá ser confirmada antes da implantação. A adoção da Apache 2.0 ou da CC BY 4.0 não poderá abranger material sobre o qual o projeto não possua titularidade ou autorização de relicenciamento.\n\n### Produtos a implementar\n\n1. confirmar titularidade institucional e autoria dos componentes do repositório;\n2. validar a compatibilidade da Apache License 2.0 com as regras institucionais aplicáveis;\n3. criar `LICENSE` na raiz para o código-fonte;\n4. criar `LICENSE-DATA.md` para dados derivados, tabelas, manifestos e downloads;\n5. criar `LICENSE-DOCS.md` ou aviso equivalente para documentação e livro científico;\n6. criar `THIRD_PARTY_NOTICE.md` com dependências, fontes e materiais não relicenciados;\n7. criar política de proveniência e atribuição obrigatória por produto publicado;\n8. registrar, em cada dataset ou manifesto, licença, titular, fonte, restrições e data de verificação;\n9. distinguir material autoral, dado derivado, metadado de terceiro e conteúdo audiovisual de terceiro;\n10. atualizar `README.md`, `README.pt-BR.md` e demais versões linguísticas com seção de licenciamento;\n11. revisar `pyproject.toml`, metadados do repositório e badges após a decisão final;\n12. adicionar validação no CI para impedir publicação de produtos sem campo de licença e proveniência;\n13. documentar exceções, incompatibilidades e fontes cujo uso seja apenas referencial ou por link;\n14. impedir que a API, os downloads públicos ou a vitrine sugiram licença sobre vídeos e mídias de terceiros;\n15. revisar a política com a instituição responsável antes da publicação pública definitiva.\n\n### Portões de governança\n\nEnquanto esta frente não estiver concluída:\n\n- a plataforma pode continuar em desenvolvimento e validação interna;\n- resultados experimentais podem permanecer como artefatos técnicos controlados;\n- datasets não devem ser anunciados como abertos ou reutilizáveis;\n- a API pública, a vitrine independente e o catálogo definitivo de downloads não devem ser ativados;\n- nenhuma licença autoral do projeto deve ser apresentada como licença dos acervos audiovisuais observados.\n\n### Critério de conclusão\n\nO GitHub reconhece a licença do código; documentação e dados derivados possuem termos próprios; cada produto público declara titularidade, proveniência, licença e restrições; materiais de terceiros não são relicenciados; e o CI bloqueia publicações sem metadados jurídicos mínimos.\n\n'''

          marker = "## P7 — consolidação da interface pública"
          if "## P6A — licenciamento do código, da documentação e dos dados" not in text:
              text = text.replace(marker, section + marker)

          old_order = "17. Manter descoberta preparatória de África, Ásia e Oceania\n18. Ativar publicação derivada e entrega pública versionada"
          new_order = "17. Manter descoberta preparatória de África, Ásia e Oceania\n18. Definir e implantar o licenciamento do código, da documentação, dos dados derivados e dos materiais de terceiros\n19. Ativar publicação derivada e entrega pública versionada somente após a conclusão do portão de licenciamento"
          text = text.replace(old_order, new_order)

          old_rule = "A ativação científica da IA permanece posterior ao baseline oficial."
          new_rule = "A ativação científica da IA permanece posterior ao baseline oficial. A publicação pública definitiva, a API e o catálogo aberto de downloads permanecem bloqueados até a conclusão do portão de licenciamento definido em P6A."
          text = text.replace(old_rule, new_rule)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit backlog update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project/BACKLOG.md
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git commit -m "Colocar licenciamento em fila no backlog"
          git push origin HEAD:presentation/rpv-1
