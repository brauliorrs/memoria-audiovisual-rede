name: KAVI 082 - first source-link metadata batch

on:
  pull_request:
    types: [opened]

permissions:
  contents: read

jobs:
  kavi-first-index:
    if: github.head_ref == 'feature/kavi-082-first-live-metadata-records-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed MAR code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install existing runtime dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Gate exact current API routes by live robots before search
        id: permit
        env:
          PYTHONPATH: src
        run: |
          mkdir -p data/output
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import requests
          from memoria_audiovisual.config import HEADERS
          from memoria_audiovisual.kavi_elonet_probe import Guard, USER_AGENT, FACET_QUERY
          from memoria_audiovisual.kavi_finna_adapter import (
              FinnaMetadataSource, FinnaScope, FORMAT_FACET_URL,
          )

          decision = {"host": "api.finna.fi", "result": "STOP", "promotion_authorized": False}
          try:
              with requests.Session() as session:
                  session.headers.update({
                      **HEADERS, "User-Agent": f"{USER_AGENT}/1.0 (+metadata-only-staging)",
                      "Accept": "application/json",
                  })
                  guard = Guard(session)
                  robots = guard.robots("api.finna.fi")
                  decision["robots_http_status"] = robots.get("status")
                  decision["robots_mode"] = robots.get("mode")
                  if robots.get("status") == 200 and robots.get("mode") == "evaluated":
                      source = FinnaMetadataSource(session, FinnaScope(
                          "0/KAVI/", "0/Video/",
                          "466006cb7a499efff354e7f4425aface044440218bdb9a20a1550a3fe079e049",
                      ))
                      paths = (
                          ("building_facet", FACET_QUERY),
                          ("format_facet", FORMAT_FACET_URL),
                          ("scope_count", source._verified_query(count_only=True)),
                          ("one_page", source._verified_query()),
                      )
                      decision["paths_allowed"] = {
                          name: guard.permitted(url) for name, url in paths
                      }
                      decision["result"] = (
                          "ALLOW" if all(decision["paths_allowed"].values())
                          else "STOP_ROBOTS"
                      )
                  else:
                      decision["result"] = "STOP_ROBOTS_UNVERIFIABLE"
          except Exception as exc:
              decision["result"] = "STOP_ENVIRONMENT"
              decision["error_class"] = type(exc).__name__
          Path("data/output/kavi_first_index_gate.json").write_text(
              json.dumps(decision, sort_keys=True, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(decision, sort_keys=True))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("allowed=" + ("true" if decision["result"] == "ALLOW" else "false") + "\n")
          PY

      - name: Stage only one page and project metadata with source links
        if: steps.permit.outputs.allowed == 'true'
        env:
          PYTHONPATH: src
        run: |
          PRIVATE_STAGING="$(mktemp -d "$RUNNER_TEMP/mar-kavi-private-XXXXXX")"
          trap 'rm -rf "$PRIVATE_STAGING"' EXIT
          mkdir -p data/output/kavi-first-index-preview
          python scripts/run_kavi_finna_metadata_staging.py \
            --evidence-sha256 466006cb7a499efff354e7f4425aface044440218bdb9a20a1550a3fe079e049 \
            --directory "$PRIVATE_STAGING" --max-pages 1 --execute \
            > "$RUNNER_TEMP/staging-summary-private.json"
          python -m scripts.project_kavi_finna_mar_index \
            --directory "$PRIVATE_STAGING" \
            --output-directory data/output/kavi-first-index-preview \
            --evidence-sha256 466006cb7a499efff354e7f4425aface044440218bdb9a20a1550a3fe079e049 \
            --expected-total "$(python -c 'import json,sys;print(json.load(open(sys.argv[1]))["expected_total"])' "$RUNNER_TEMP/staging-summary-private.json")" \
            > data/output/kavi_first_index_summary.json
          python - <<'PY'
          import csv
          import json
          from pathlib import Path
          root = Path("data/output/kavi-first-index-preview")
          manifest = json.loads((root / "kavi_mar_projection_manifest.json").read_text())
          rows = list(csv.DictReader((root / "kavi_mar_metadata_links_PREVIEW.csv").open(encoding="utf-8", newline="")))
          assert manifest["record_count"] == len(rows) and len(rows) > 0
          assert manifest["source_staging_status"] == "partial"
          assert manifest["promotion_authorized"] is False
          assert manifest["media_downloaded"] is False
          assert all(r["video_link"] == r["source_record_url"] for r in rows)
          assert len({r["source_record_id"] for r in rows}) == len(rows)
          assert all("://" not in r["video_title"] for r in rows)
          print(json.dumps({
              "records": len(rows),
              "source_item_links": manifest["item_links_present"],
              "missing_item_links": manifest["item_links_missing"],
              "total": manifest["expected_total_api_index"],
              "status": manifest["coverage_status"],
              "promotion_authorized": False,
              "media_downloaded": False,
          }, sort_keys=True))
          PY

      - name: Upload metadata-only catalog preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kavi-082-first-link-index-20261019
          path: |
            data/output/kavi_first_index_gate.json
            data/output/kavi_first_index_summary.json
            data/output/kavi-first-index-preview/
          retention-days: 15
          if-no-files-found: error
