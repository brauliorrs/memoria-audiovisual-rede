name: Register M3 VAL-007 and CAL-008

on:
  push:
    branches:
      - presentation/rpv-1
    paths:
      - .github/workflows/register-m3-val007-cal008.yml

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scientific branch
        uses: actions/checkout@v4
        with:
          ref: presentation/rpv-1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install registry validation dependencies
        run: python -m pip install --upgrade jsonschema

      - name: Register completed M3 experiments
        run: python scripts/register_m3_val007_cal008.py

      - name: Validate canonical experiment registry
        run: python scripts/validate_experiment_registry.py

      - name: Commit registry update
        run: |
          if git diff --quiet -- data/digital_infrastructure/ai_experiments/experiment_registry_v1.json; then
            echo "Registry already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/digital_infrastructure/ai_experiments/experiment_registry_v1.json
          git commit -m "Register M3 VAL-007 and CAL-008"
          git push origin HEAD:presentation/rpv-1
