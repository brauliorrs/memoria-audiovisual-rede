name: MAR Historical Title Word Cloud

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/build_mar_title_wordcloud.py"
      - "site/data/title-wordcloud.json"
      - "site/components/title-wordcloud.tsx"
      - "tests/test_mar_wordcloud_growth.py"
      - "tests/test_mar_title_wordcloud.py"
      - ".github/workflows/mar-title-wordcloud.yml"
  push:
    branches: [main]
    paths:
      - "scripts/build_mar_title_wordcloud.py"
      - "site/data/title-wordcloud.json"
      - "data/output/*_catalogo_videos_analitico.csv"
      - "site/data/kavi-public.json"
      - ".github/workflows/mar-title-wordcloud.yml"

permissions:
  contents: read

jobs:
  review-title-frequency:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Audit historical titles and emit aggregated candidate
        run: python scripts/build_mar_title_wordcloud.py --stdout
      - name: Check incremental source updates
        run: python3 -m unittest discover -s tests -p "test_mar_wordcloud_growth.py" -v
      - name: Check approved aggregate against deterministic source generation
        run: |
          if test -f site/data/title-wordcloud.json; then
            python scripts/build_mar_title_wordcloud.py --check
          else
            echo "Candidate is not committed yet. Review generated aggregate before publishing."
          fi
